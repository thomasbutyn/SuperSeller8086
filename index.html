<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperSeller8086 - Stock Trading Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #0a0e27;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0e27;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow: hidden;
            padding: 20px;
        }

        .fullscreen-overlay.hidden {
            display: none;
        }

        .intro-console {
            width: 100%;
            aspect-ratio: 1;
            max-width: 600px;
            background-color: #1a1f3a;
            border: 3px solid #ffffff;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            display: grid;
            grid-template-columns: repeat(40, 1fr);
            grid-template-rows: repeat(30, 1fr);
            padding: 0;
            gap: 0;
            overflow: hidden;
        }

        .console-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1vw;
            line-height: 1;
            text-shadow: 0 0 5px #ffffff;
            white-space: pre;
            aspect-ratio: 1;
        }

        @media (max-width: 900px) {
            .console-cell {
                font-size: 1.5vw;
            }
        }

        .game-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            aspect-ratio: 1;
            max-width: 600px;
            background-color: #1a1f3a;
            border: 3px solid #ffffff;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            display: grid;
            grid-template-columns: repeat(40, 1fr);
            grid-template-rows: repeat(30, 1fr);
            padding: 0;
            gap: 0;
            overflow: hidden;
        }

        .game-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1vw;
            line-height: 1;
            text-shadow: 0 0 5px #ffffff;
            white-space: pre;
            aspect-ratio: 1;
            border-bottom: 1px solid #0a0e27;
            border-right: 1px solid #0a0e27;
        }

        @media (max-width: 900px) {
            .game-cell {
                font-size: 1.5vw;
            }
        }

        .results-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0e27;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            flex-direction: column;
            gap: 30px;
            padding: 20px;
        }

        .results-screen.show {
            display: flex;
        }

        .results-console {
            width: 100%;
            aspect-ratio: 1;
            max-width: 600px;
            background-color: #1a1f3a;
            border: 3px solid #ffffff;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            display: grid;
            grid-template-columns: repeat(40, 1fr);
            grid-template-rows: repeat(30, 1fr);
            padding: 0;
            gap: 0;
            overflow: hidden;
            font-size: 1vw;
        }

        .results-text {
            grid-column: 1 / -1;
            grid-row: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            white-space: pre;
            padding: 20px;
            line-height: 1.4;
            text-shadow: 0 0 5px #ffffff;
        }

        .results-button {
            background-color: #ffffff;
            color: #0a0e27;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            border-radius: 3px;
            transition: all 0.3s;
        }

        .results-button:hover {
            background-color: #cccccc;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="fullscreen-overlay" id="overlay">
        <div class="intro-console" id="introConsole"></div>
    </div>

    <div class="results-screen" id="resultsScreen">
        <div class="results-console">
            <div class="results-text" id="resultsText"></div>
        </div>
        <button class="results-button" onclick="startNewRound()">NEXT ROUND (ENTER)</button>
    </div>

    <div class="game-wrapper">
        <div class="game-container" id="gameConsole"></div>
    </div>

    <script>
        // 40x30 grid intro screens
        const introScreens = [
            // Screen 1: Title
            [
                "                                        ",
                "                                        ",
                "                                        ",
                "          > SUPERSELLER8086 <           ",
                "                                        ",
                "          █████████████████              ",
                "          █████████████████              ",
                "          █████████████████              ",
                "          █████████████████              ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "        Press ENTER to continue         "
            ],
            // Screen 2: Warning
            [
                "                                        ",
                "                                        ",
                "        WELCOME TO STOCK TRADING        ",
                "                                        ",
                "    WARNING: Each round lasts 30 secs!  ",
                "                                        ",
                "    Unsold stocks will EXPIRE and       ",
                "    become WORTHLESS ($0 value)         ",
                "                                        ",
                "    Buy & sell quickly to maximize      ",
                "    profits before expiration!          ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "        Press ENTER to continue         "
            ],
            // Screen 3: Instructions
            [
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "           BUY (Q) / SELL (A)           ",
                "                                        ",
                "       Watch the price chart and        ",
                "       decide when to buy or sell       ",
                "                                        ",
                "       Type quantity after pressing     ",
                "       Q or A, then press ENTER         ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "        Press ENTER to continue         "
            ]
        ];

        let currentScreen = 0;
        let waitingForEnter = false;
        let gameActive = false;

        function renderGrid(grid, container, animate = false) {
            container.innerHTML = '';
            grid.forEach((line, rowIdx) => {
                const chars = line.split('');
                chars.forEach((char, colIdx) => {
                    const cell = document.createElement('div');
                    cell.className = animate ? 'console-cell' : 'game-cell';
                    cell.textContent = char;
                    
                    if (animate) {
                        // Staggered animation by column
                        const delay = colIdx * 0.02;
                        cell.style.animation = `slideDown 0.5s ease-out ${delay}s both`;
                    }
                    
                    container.appendChild(cell);
                });
            });
            
            // Add keyframes if animating
            if (animate && !document.querySelector('style[data-animation]')) {
                const style = document.createElement('style');
                style.setAttribute('data-animation', 'true');
                style.textContent = `
                    @keyframes slideDown {
                        from {
                            transform: translateY(-100%);
                            opacity: 0;
                        }
                        to {
                            transform: translateY(0);
                            opacity: 1;
                        }
                    }
                `;
                document.head.appendChild(style);
            }
        }

        function showIntroScreen() {
            if (currentScreen < introScreens.length) {
                const grid = introScreens[currentScreen];
                renderGrid(grid, document.getElementById('introConsole'), true);
                waitingForEnter = true;
                currentScreen++;
            } else {
                startGameplay();
            }
        }

        function startGameplay() {
            document.getElementById('overlay').classList.add('hidden');
            gameActive = true;
            startRound();
        }

        // Stock data
        const stock = {
            price: 45,
            volatility: 0.15,
            history: [45]
        };

        let player = {
            cash: 1000,
            shares: 0,
            startingCash: 1000
        };

        let roundTime = 30;
        let roundInterval = null;
        let currentMode = null; // 'buy' or 'sell'
        let modeActive = false;

        function buildGameGrid() {
            const grid = Array(30).fill(null).map(() => Array(40).fill(' '));
            
            // Header: price and timer
            const header = `RED $${stock.price.toFixed(2)}`.padEnd(20);
            const timer = `${roundTime}s`.padStart(20);
            const topLine = header + timer;
            topLine.split('').forEach((char, i) => {
                if (i < 40) grid[0][i] = char;
            });

            // Separator
            grid[1] = Array(40).fill('─');

            // Chart (rows 3-18)
            const chartStart = 3;
            const chartHeight = 12;
            const history = stock.history.slice(-40);
            const maxPrice = Math.max(...history);
            const minPrice = Math.min(...history);
            const range = maxPrice - minPrice || 1;

            for (let i = 0; i < chartHeight; i++) {
                for (let j = 0; j < Math.min(history.length, 38); j++) {
                    const normalized = (history[j] - minPrice) / range;
                    const barHeight = Math.round(normalized * (chartHeight - 1));
                    grid[chartStart + chartHeight - 1 - i][j + 1] = barHeight >= (chartHeight - 1 - i) ? '·' : ' ';
                }
            }

            // Status line
            grid[16] = Array(40).fill('─');

            // Buy/Sell mode display
            if (modeActive) {
                const modeText = currentMode === 'buy' ? 'BUY MODE' : 'SELL MODE';
                modeText.split('').forEach((char, i) => {
                    if (i < 40) grid[18][i] = char;
                });
            }

            // Stats (rows 19-25)
            const cash = `Cash: $${player.cash.toFixed(2)}`.substring(0, 40);
            const shares = `Shares: ${player.shares}`.substring(0, 40);
            const value = `Value: $${(player.shares * stock.price).toFixed(2)}`.substring(0, 40);
            
            cash.split('').forEach((char, i) => { if (i < 40) grid[20][i] = char; });
            shares.split('').forEach((char, i) => { if (i < 40) grid[21][i] = char; });
            value.split('').forEach((char, i) => { if (i < 40) grid[22][i] = char; });

            // Instructions
            grid[27] = Array(40).fill('─');
            const instruct1 = 'Q: Buy | A: Sell';
            instruct1.split('').forEach((char, i) => { if (i < 40) grid[28][i] = char; });

            const instruct2 = modeActive ? 'Enter qty and press ENTER' : 'Press Q or A to trade';
            instruct2.split('').forEach((char, i) => { if (i < 40) grid[29][i] = char; });

            return grid;
        }

        function updateGameDisplay() {
            const grid = buildGameGrid();
            const gridStr = grid.map(row => row.join('')).join('\n');
            renderGrid(grid, document.getElementById('gameConsole'), false);
        }

        function updateStockPrice() {
            const changePercent = (Math.random() - 0.5) * stock.volatility;
            const newPrice = Math.max(1, stock.price * (1 + changePercent));
            stock.price = parseFloat(newPrice.toFixed(2));
            stock.history.push(stock.price);
            updateGameDisplay();
        }

        function startRound() {
            roundTime = 30;
            stock.history = [stock.price];
            modeActive = false;
            updateGameDisplay();

            if (roundInterval) clearInterval(roundInterval);

            roundInterval = setInterval(() => {
                roundTime--;
                updateGameDisplay();

                if (roundTime <= 0) {
                    endRound();
                }
            }, 1000);
        }

        function endRound() {
            clearInterval(roundInterval);
            gameActive = false;
            
            const portfolioValue = player.shares * stock.price;
            const totalValue = player.cash + portfolioValue;
            const profit = totalValue - player.startingCash;
            const profitPercent = ((profit / player.startingCash) * 100).toFixed(1);

            let resultsText = `ROUND OVER

Final Price: $${stock.price.toFixed(2)}
Unsold Shares: ${player.shares}

Cash: $${player.cash.toFixed(2)}
Portfolio: $${portfolioValue.toFixed(2)}
Total: $${totalValue.toFixed(2)}

Profit: $${profit.toFixed(2)} (${profitPercent}%)`;

            document.getElementById('resultsText').textContent = resultsText;
            document.getElementById('resultsScreen').classList.add('show');
        }

        function startNewRound() {
            document.getElementById('resultsScreen').classList.remove('show');
            
            player.cash = 1000;
            player.shares = 0;
            player.startingCash = 1000;
            stock.price = 45;
            stock.history = [45];
            stock.volatility = 0.15;
            gameActive = true;
            
            startRound();
        }

        function buyStock(quantity) {
            if (!quantity || quantity <= 0) return false;

            const cost = stock.price * quantity;
            if (cost > player.cash) return false;

            player.cash -= cost;
            player.shares += quantity;
            return true;
        }

        function sellStock(quantity) {
            if (!quantity || quantity <= 0) return false;
            if (player.shares < quantity) return false;

            const proceeds = stock.price * quantity;
            player.cash += proceeds;
            player.shares -= quantity;
            return true;
        }

        function submitCommand() {
            if (waitingForEnter) {
                waitingForEnter = false;
                showIntroScreen();
                return;
            }

            if (!gameActive) return;

            const input = document.getElementById('commandInput');
            const command = input.value.trim();

            if (!command) return;

            let success = false;
            
            if (currentMode === 'buy') {
                const quantity = parseInt(command);
                success = buyStock(quantity);
            } else if (currentMode === 'sell') {
                const quantity = parseInt(command);
                success = sellStock(quantity);
            }

            if (success) {
                modeActive = false;
                currentMode = null;
                updateGameDisplay();
            }

            input.value = '';
            input.focus();
        }

        // Handle Q and A key presses
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitCommand();
                return;
            }

            if (!gameActive) return;
            
            if (e.key === 'q' || e.key === 'Q') {
                e.preventDefault();
                currentMode = 'buy';
                modeActive = true;
                updateGameDisplay();
            } else if (e.key === 'a' || e.key === 'A') {
                e.preventDefault();
                currentMode = 'sell';
                modeActive = true;
                updateGameDisplay();
            }
        });

        // Create dummy input for Enter handling
        const dummyInput = document.createElement('input');
        dummyInput.id = 'commandInput';
        dummyInput.style.display = 'none';
        document.body.appendChild(dummyInput);

        // Start intro sequence
        showIntroScreen();
    </script>
</body>
</html>
