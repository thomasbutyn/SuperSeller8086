function buildRoomGrid(tick = 0) {
    const g   = makeGrid();
    const col = makeColorGrid();

    writeCenter(g, 1, 'ROOM');
    for (let c = 0; c < COLS; c++) col[1][c] = '#ffffff';
    fillRow(g, 2, '─');
    for (let c = 0; c < COLS; c++) col[2][c] = '#444444';

    // ── Room perspective box ──────────────────────────────────────────────────
    // Outer walls: full content zone edges  rows 3..32, cols 0..39
    // Back wall (inset): rows 7..26, cols 8..31
    // Perspective lines connect outer corners to inner corners

    const OT = 3,  OB = 32, OL = 0,  OR = 39;
    const IT = 7,  IB = 26, IL = 8,  IR = 31;
    const WC = '#ffffff';  // all room lines white

    // Back wall border only — no fill pattern
    for (let c = IL; c <= IR; c++) { g[IT][c] = '─'; g[IB][c] = '─'; col[IT][c] = WC; col[IB][c] = WC; }
    for (let r = IT; r <= IB; r++) { g[r][IL] = '│'; g[r][IR] = '│'; col[r][IL] = WC; col[r][IR] = WC; }
    g[IT][IL]='┌'; g[IT][IR]='┐'; g[IB][IL]='└'; g[IB][IR]='┘';

    // Floor
    for (let c = OL; c <= OR; c++) { g[OB][c] = '─'; col[OB][c] = WC; }
    // Ceiling
    for (let c = OL; c <= OR; c++) { g[OT][c] = '─'; col[OT][c] = WC; }
    // Left wall
    for (let r = OT; r <= OB; r++) { g[r][OL] = '│'; col[r][OL] = WC; }
    // Right wall
    for (let r = OT; r <= OB; r++) { g[r][OR] = '│'; col[r][OR] = WC; }
    // Outer corners
    g[OT][OL]='╔'; g[OT][OR]='╗'; g[OB][OL]='╚'; g[OB][OR]='╝';
    col[OT][OL]=col[OT][OR]=col[OB][OL]=col[OB][OR]=WC;

    // Perspective lines connecting outer corners to inner corners
    const drawPerspLine = (r0, c0, r1, c1) => {
        const steps = Math.max(Math.abs(r1-r0), Math.abs(c1-c0));
        for (let i = 0; i <= steps; i++) {
            const r = Math.round(r0 + (r1-r0) * i/steps);
            const c = Math.round(c0 + (c1-c0) * i/steps);
            if (r >= 0 && r < KB_TOP && c >= 0 && c < COLS && g[r][c] === ' ') {
                const dr = r1-r0, dc = c1-c0;
                const ch = Math.abs(dc) > Math.abs(dr)*1.5 ? '─'
                         : Math.abs(dr) > Math.abs(dc)*1.5 ? '│'
                         : (dr*dc > 0) ? '\\' : '/';
                g[r][c] = ch; col[r][c] = WC;
            }
        }
    };
    drawPerspLine(OT, OL, IT, IL);
    drawPerspLine(OT, OR, IT, IR);
    drawPerspLine(OB, OL, IB, IL);
    drawPerspLine(OB, OR, IB, IR);

    // ── CHANDELIER — hangs from ceiling centre, rows 3-10 ──
    if (player.decorations.has('chandelier')) {
        const p = tick % 4;
        const B = ['●','○','◉','○'];
        const art = [
            '      │      ',
            '  ╔═══╩═══╗  ',
            `  ║${B[p]} ║ ${B[(p+1)%4]}║  `,
            `  ╠${B[(p+2)%4]}═══╬═══${B[(p+3)%4]}╣  `,
            '  ╚═══╩═══╝  ',
        ];
        art.forEach((line, i) => {
            writeCenter(g, 4 + i, line);
            for (let c = 0; c < COLS; c++)
                if (g[4+i][c] !== ' ' && g[4+i][c] !== '░') col[4+i][c] = i === 0 ? '#888844' : i >= 3 ? '#ffee88' : '#ccaa00';
        });
    }

    // ── DESK PLANT — bottom-left, rows 20-31, cols 1-13 ──
    if (player.decorations.has('plant')) {
        const art = [
            '   \\|/|\\|/   ',
            '  --*-|-*--  ',
            '   /|\\|/|\\   ',
            '    ( | )    ',
            '   ( _|_ )   ',
            '  (  |||  )  ',
            '    |||||    ',
            '   ═══════   ',
            '   ║     ║   ',
            '   ╚═════╝   ',
        ];
        art.forEach((line, i) => {
            writeStr(g, 21 + i, 1, line);
            const isLeaf = i < 3, isPot = i >= 7;
            for (let c = 1; c < 1 + line.length; c++)
                if (g[21+i][c] !== ' ' && g[21+i][c] !== '░')
                    col[21+i][c] = isPot ? '#886633' : isLeaf ? (i===0?'#33ff33':'#22cc22') : '#228822';
        });
    }

    // ── GAMER — desktop tower, monitor and desk, rows 9-20, cols 19-38 ──
    if (player.decorations.has('monitor')) {
        const art = [
            ' ┌───────────┐ ┌──┐',
            ' │ ╔═══════╗ │ │▓▓│',
            ' │ ║>_     ║ │ │  │',
            ' │ ║       ║ │ │░░│',
            ' │ ║  ████ ║ │ │▓▓│',
            ' │ ║ ░░░░░ ║ │ │  │',
            ' │ ╚═══════╝ │ │░░│',
            ' └─────┬─────┘ │▓▓│',
            '  ═════╧═════  └──┘',
            ' ┌─────────────────┐',
            ' │░░░░░░░░░░░░░░░░░│',
            ' └─────────────────┘',
        ];
        const monCol  = '#44aaff';
        const deskCol = '#886633';
        const towerCol = '#556677';
        art.forEach((line, i) => {
            writeStr(g, 9 + i, 19, line);
            for (let c = 19; c < 19 + line.length; c++) {
                if (g[9+i][c] === ' ' || g[9+i][c] === '░') continue;
                // tower = rightmost 4 cols (cols 35-38)
                const isTower = c >= 35;
                const isDesk  = i >= 9;
                col[9+i][c] = isTower ? towerCol : isDesk ? deskCol : monCol;
            }
            // colour the ░ fill chars too
            for (let c = 19; c < 19 + line.length; c++) {
                if (g[9+i][c] !== '░') continue;
                const isTower = c >= 35;
                const isDesk  = i >= 9;
                col[9+i][c] = isTower ? '#334455' : isDesk ? '#664422' : '#2255aa';
            }
        });
    }

    // ── LAVA LAMP — bottom-right, rows 19-29, cols 28-38 ──
    if (player.decorations.has('lamp')) {
        // Three bubbles cycle upward through 6 rows of the glass body
        const f = Math.floor(tick / 2) % 6;
        // bubble positions 0=bottom row .. 5=top row of glass
        const b0 = (f + 0) % 6;
        const b1 = (f + 3) % 6;
        const b2 = (f + 5) % 6;

        // Build 6 glass body rows; inner width 5 chars, bubbles at cols 1, 3
        const glass = Array.from({length: 6}, (_, row) => {
            const inner = [' ', ' ', ' ', ' ', ' '];
            if (5 - row === b0) inner[1] = '●';
            if (5 - row === b1) inner[3] = '●';
            if (5 - row === b2) inner[2] = '○';
            return inner.join('');
        });

        const art = [
            ' ╔═════╗ ',   // 0 lamp cap top
            ' ║·····║ ',   // 1 lamp cap glow
            ' ╚══╦══╝ ',   // 2 cap base
            '   ╔╩╗   ',   // 3 neck
            ' ╔═╩═╩═╗ ',   // 4 glass shoulder
            ...glass.map(l => ` ║ ${l} ║ `), // 5-10 glass body
            ' ╚══╦══╝ ',   // 11 glass base
            '   ═╩═   ',   // 12 foot
            ' ═══════ ',   // 13 base plate
        ];

        art.forEach((line, i) => {
            writeStr(g, 18 + i, 28, line);
            for (let c = 28; c < 28 + line.length; c++) {
                const ch = g[18+i][c];
                if (ch === ' ') continue;
                const isBubble = ch === '●' || ch === '○';
                const isCap    = i <= 2;
                const isGlass  = i >= 4 && i <= 11;
                col[18+i][c] = isBubble ? '#ffbb00'
                             : isCap    ? '#ffdd66'
                             : isGlass  ? '#cc4400'
                             : '#993300';
            }
        });
    }

    // ── BUTLER — bottom centre, rows 22-29 ──
    if (player.decorations.has('butler')) {
        const frame = BUTLER_FRAMES[Math.floor(tick / 4) % BUTLER_FRAMES.length];
        frame.forEach((line, i) => {
            writeCenter(g, 22 + i, line);
            for (let c = 0; c < COLS; c++) {
                const ch = g[22+i][c];
                if (ch === ' ') continue;
                // rows 0-4 = face/head (skin tone), rows 5-7 = collar/jacket (white/grey)
                col[22+i][c] = i <= 4 ? '#ddaa88' : '#eeeeee';
            }
        });
    }

    return { g, col };
}

async function showRoomScreen(fromGrid, fromColors) {
    butlerTick = 0;
    const { g: roomG, col: roomCol } = buildRoomGrid(butlerTick);
    transitioning = true;
    await randomTransition(fromGrid, roomG, fromColors, roomCol);
    transitioning = false;

    const renderRoom = () => {
        const { g, col } = buildRoomGrid(butlerTick);
        const full  = [...g.slice(0, KB_TOP), ...Array(ROWS - KB_TOP).fill(null).map(() => Array(COLS).fill(' '))];
        const fullC = [...col.slice(0, KB_TOP), ...Array(ROWS - KB_TOP).fill(null).map(() => Array(COLS).fill(null))];
        renderer.render(full, fullC, false);
    };
    renderRoom();

    roomInterval = setInterval(() => {
        if (transitioning || !waitingForRoom) { clearInterval(roomInterval); roomInterval = null; return; }
        butlerTick++;
        renderRoom();
    }, 200);

    waitingForRoom = true;
}

async function handleRoomEnter() {
    waitingForRoom = false;
    if (roomInterval) { clearInterval(roomInterval); roomInterval = null; }
    const { g: roomG, col: roomCol } = buildRoomGrid(butlerTick);
    const { g: upG,   col: upCol   } = buildUpgradeGrid();
    // Transition to game
    Object.assign(player, { startingCash: player.cash, green: 0, red: 0, blue: 0, yellow: 0 });
    simulateAllPrices();
    gameActive = true;
    const { g: gameG, col: gameCol } = buildGameGrid();
    transitioning = true;
    await randomTransition(roomG, gameG, roomCol, gameCol);
    transitioning = false;
    startRound();
}

async function handleUpgradeEnter() {
    waitingForUpgrade = false;
    const { g: upG, col: upCol } = buildUpgradeGrid();

}

async function endRound() {
    if (!gameActive) return;
    gameActive = false;

    const colorTotal = ['green','red','blue','yellow'].reduce((s, c) => s + player[c] * priceAtTick(c, ROUND_TICKS), 0);
    const total  = player.cash + colorTotal;
    const profit = total - player.startingCash;

    // Liquidate stocks into cash now so the KB cash row updates immediately
    ['green','red','blue','yellow'].forEach(c => {
        player.cash += player[c] * priceAtTick(c, ROUND_TICKS);
        player[c] = 0;
    });

    // Store profit for buildSocialGrid to embed
    lastProfit        = profit;
    lastStartingCash  = player.startingCash;

    // Random transition into the round-over / social screen
    const { g: gameG, col: gameCol } = buildGameGrid();
    const { g: socialG, col: socialCol } = buildSocialGrid();

    transitioning = true;
    await randomTransition(gameG, socialG, gameCol, socialCol);

const KEY_COLOR = { q: 'green', w: 'red', e: 'blue', r: 'yellow', a: 'green', s: 'red', d: 'blue', f: 'yellow' };
const BUY_KEYS  = new Set(['q','w','e','r']);
const SELL_KEYS = new Set(['a','s','d','f']);

function submitCommand() {
    if (waitingForUpgrade)  { sfxEnter(); handleUpgradeEnter();  return; }
    if (waitingForShopping) { sfxEnter(); handleShoppingEnter(); return; }
    if (waitingForRoom)     { sfxEnter(); handleRoomEnter();     return; }
    if (waitingForResults)  { sfxEnter(); handleResultsEnter();  return; }
    if (gameActive && !transitioning) { sfxEnter(); endRound(); return; }
    if (waitingForEnter) {
        waitingForEnter = false;
        transitioning = true;
        clearInterval(broadwayInterval);
        broadwayInterval = null;
        sfxEnter();
        startGameplay();
    }
}

// Track which keys are physically held right now. The animation loops read this
// each frame — no rendering ever happens inside the input handlers.
const keysHeld = new Set();

function flashKey(keyVal) { keysHeld.add(keyVal); }
function isKeyPressed(keyVal) { return keysHeld.has(keyVal) || keysHeld.has(keyVal.toLowerCase()) || keysHeld.has(keyVal.toUpperCase()); }

document.addEventListener('keyup', e => {
    keysHeld.delete(e.key);
    keysHeld.delete(e.key.toLowerCase());
    keysHeld.delete(e.key.toUpperCase());
});

// ─── INPUT ────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
    keysHeld.add(e.key);
    if (e.repeat) return;

    if (e.key === ' ') { e.preventDefault(); submitCommand(); return; }

    const k = e.key.toLowerCase();
    if (!BUY_KEYS.has(k) && !SELL_KEYS.has(k)) return;
    e.preventDefault();

    if (waitingForEnter) return;

    if (waitingForShopping) {
        handleShoppingKey(k);
        return;
    }

    if (waitingForUpgrade) {
        handleUpgradeKey(k);
        return;
    }

    if (!gameActive) return;
    const color = KEY_COLOR[k];
    if (!color) return;
    if (!player.unlocked.has(color)) return;
    const tick = Math.round(scanCol / (COLS - 1) * ROUND_TICKS);

    const recordImpact = (isBuy) => {
        const colorHexMap = { green: '#88ff88', red: '#ff8888', blue: '#88aaff', yellow: '#ffee88' };
        const hist = STOCKS[color].history;
        const t  = (hist.length - 1) * (scanCol / (COLS - 1));
        const lo = Math.floor(t), hi = Math.min(lo + 1, hist.length - 1);
        const val = hist[lo] + (hist[hi] - hist[lo]) * (t - lo);
        buyImpacts.push({ row: chartRowOf(val), col: scanCol, hex: colorHexMap[color], frames: 5, isBuy });
    };

    if (BUY_KEYS.has(k)) {
        const price = priceAtTick(color, tick);
        const qty = player.multiplier;
        const total = price * qty;
        if (player.cash >= total) {
            player.cash -= total;
            player[color] += qty;
            recordImpact(true);
            sfxBuy();
            updateGameDisplay();
        } else if (player.cash >= price) {
            const canBuy = Math.floor(player.cash / price);
            player.cash -= price * canBuy;
            player[color] += canBuy;
            recordImpact(true);
            sfxBuy();
            updateGameDisplay();
        }
    } else {
        const price = priceAtTick(color, tick);
        const qty = Math.min(player.multiplier, player[color]);
        if (qty > 0) {
            player.cash += price * qty;
            player[color] -= qty;
            recordImpact(false);
            sfxSell();
            updateGameDisplay();
        }
    }
});

// ─── CHIP MUSIC ENGINE ────────────────────────────────────────────────────────
// MIDI is loaded at runtime from SuperSeller8086.mid in the same folder.
// Track 0: Bass      (ch0  — square wave, +1 oct)
// Track 1: Guitar    (ch1  — detuned squares)
// Track 2: Drums     (ch9  — 35=kick, 40=snare, 42=hihat)
// Track 3: Pop Synth (ch2  — triangle lead melody)

let CHIP_MIDI = null; // populated by loadMidi()

function parseMidi(buffer) {
    const u8 = new Uint8Array(buffer);
    let pos = 0;

    const readU16 = () => { const v = (u8[pos] << 8) | u8[pos+1]; pos += 2; return v; };
    const readU32 = () => { const v = (u8[pos]<<24)|(u8[pos+1]<<16)|(u8[pos+2]<<8)|u8[pos+3]; pos += 4; return v >>> 0; };
    const readVarLen = () => {
        let v = 0;
        for (let i = 0; i < 4; i++) { const b = u8[pos++]; v = (v << 7) | (b & 0x7f); if (!(b & 0x80)) break; }
        return v;
    };

    pos += 4; // MThd
    pos += 4; // header length
    const fmt     = readU16();
    const ntracks = readU16();
    const tpb     = readU16();

    let tempo = 500000;
    const allTracks = [];

    for (let t = 0; t < ntracks; t++) {
        pos += 4; // MTrk
        const tlen = readU32();
        const end  = pos + tlen;
        const events = [];
        let absTick = 0, running = 0;

        while (pos < end) {
            absTick += readVarLen();
            let b = u8[pos];
            if (b === 0xff) {                          // meta
                pos++;
                const mtype = u8[pos++];
                const mlen  = readVarLen();
                if (mtype === 0x51 && mlen === 3) {
                    tempo = ((u8[pos] << 16) | (u8[pos+1] << 8) | u8[pos+2]) >>> 0;
                }
                pos += mlen;
            } else if (b === 0xf0 || b === 0xf7) {    // sysex
                pos++;
                pos += readVarLen();
            } else {
                if (b & 0x80) { running = b; pos++; }
                const status = running & 0xf0;
                const ch     = running & 0x0f;
                if (status === 0x90) {
                    const note = u8[pos++], vel = u8[pos++];
                    events.push(vel > 0 ? [absTick,'on',ch,note,vel] : [absTick,'off',ch,note]);
                } else if (status === 0x80) {
                    const note = u8[pos++]; pos++;
                    events.push([absTick,'off',ch,note]);
                } else if (status === 0xc0 || status === 0xd0) { pos++; }
                else if (status === 0xa0 || status === 0xb0 || status === 0xe0) { pos += 2; }
                else { pos++; }
            }
        }
        pos = end;
        allTracks.push(events);
    }

    // Split into per-channel tracks (engine expects one array per synth voice)
    // Channels present: 0=bass, 1=guitar, 9=drums, 2=synth
    const chOrder = [0, 1, 9, 2];
    const byChannel = {};
    allTracks.forEach(evs => evs.forEach(ev => {
        const ch = ev[2];
        if (!byChannel[ch]) byChannel[ch] = [];
        byChannel[ch].push(ev);
    }));
    const tracks = chOrder.map(ch => (byChannel[ch] || []).sort((a,b) => a[0]-b[0]));

    const totalTicks = Math.max(...tracks.flat().map(e => e[0]));
    return { tpb, tempo, totalTicks, tracks };
}

async function loadMidi() {
    const resp = await fetch('./SuperSeller8086.mid');
    if (!resp.ok) throw new Error(`Failed to load MIDI: ${resp.status}`);
    const buf = await resp.arrayBuffer();
    CHIP_MIDI = parseMidi(buf);
    // 1-bar intro = tpb * 4 ticks
    CHIP_MIDI.introEnd  = CHIP_MIDI.tpb * 4;
    CHIP_MIDI.loopStart = CHIP_MIDI.tpb * 4;
    CHIP_MIDI.loopEnd   = CHIP_MIDI.totalTicks;
}

const CHIP_TOTAL_TICKS = null; // unused — CHIP_MIDI.loopEnd used directly

// MIDI note → frequency
function midiToHz(note) { return 440 * Math.pow(2, (note - 69) / 12); }

let chipAudioCtx = null;
let chipLoopTimeout = null;
let chipStarted = false;

function chipEnsureCtx() {
    if (!chipAudioCtx) chipAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (chipAudioCtx.state === 'suspended') chipAudioCtx.resume();
}

// Separate gain nodes so SFX don't duck the music.
// Drums get their own bus so they can be mixed independently of pitched voices.
let chipMasterGain = null;
let chipDrumGain   = null;
let chipLeadGain   = null;
let chipSfxGain    = null;

function chipGetMaster() {
    chipEnsureCtx();
    if (!chipMasterGain) {
        chipMasterGain = chipAudioCtx.createGain();
        chipMasterGain.gain.value = 0.13;  // pitched voices: bass + guitar + synth
        chipMasterGain.connect(chipAudioCtx.destination);
    }
    return chipMasterGain;
}
function chipGetDrum() {
    chipEnsureCtx();
    if (!chipDrumGain) {
        chipDrumGain = chipAudioCtx.createGain();
        chipDrumGain.gain.value = 0.85;    // drums run nearly full — they need to hit hard
        chipDrumGain.connect(chipAudioCtx.destination);
    }
    return chipDrumGain;
}
function chipGetSfx() {
    chipEnsureCtx();
    if (!chipSfxGain) {
        chipSfxGain = chipAudioCtx.createGain();
        chipSfxGain.gain.value = 0.5;
        chipSfxGain.connect(chipAudioCtx.destination);
    }
    return chipSfxGain;
}
function chipGetLead() {
    chipEnsureCtx();
    if (!chipLeadGain) {
        chipLeadGain = chipAudioCtx.createGain();
        chipLeadGain.gain.value = 1.0; // sits in front of master, so master still controls overall level
        chipLeadGain.connect(chipGetMaster());
    }
    return chipLeadGain;
}

// Smooth mute/unmute helpers — 80 ms fade so there are no clicks
const MUTE_FADE = 0.08;
function chipMuteDrum()   { if (!chipDrumGain) return; const now = chipAudioCtx.currentTime; chipDrumGain.gain.setValueAtTime(chipDrumGain.gain.value, now); chipDrumGain.gain.linearRampToValueAtTime(0, now + MUTE_FADE); }
function chipUnmuteDrum() { if (!chipDrumGain) return; const now = chipAudioCtx.currentTime; chipDrumGain.gain.setValueAtTime(chipDrumGain.gain.value, now); chipDrumGain.gain.linearRampToValueAtTime(0.85, now + MUTE_FADE); }
function chipMuteLead()   { if (!chipLeadGain) return; const now = chipAudioCtx.currentTime; chipLeadGain.gain.setValueAtTime(chipLeadGain.gain.value, now); chipLeadGain.gain.linearRampToValueAtTime(0, now + MUTE_FADE); }
function chipUnmuteLead() { if (!chipLeadGain) return; const now = chipAudioCtx.currentTime; chipLeadGain.gain.setValueAtTime(chipLeadGain.gain.value, now); chipLeadGain.gain.linearRampToValueAtTime(1.0, now + MUTE_FADE); }

// ── Sound effects ─────────────────────────────────────────────────────────────

// Enter / confirm: short ascending two-note chip blip
function sfxEnter() {
    chipEnsureCtx();
    const ctx = chipAudioCtx;
    const sfx = chipGetSfx();
    const now = ctx.currentTime;
    [[523, 0, 0.07], [784, 0.07, 0.12]].forEach(([freq, delay, dur]) => {
        const osc = ctx.createOscillator();
        const g   = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.55, now + delay);
        g.gain.linearRampToValueAtTime(0, now + delay + dur);
        osc.connect(g); g.connect(sfx);
        osc.start(now + delay); osc.stop(now + delay + dur + 0.01);
    });
}

// Buy: ascending chip arpeggio (C–E–G), bright and punchy
function sfxBuy() {
    chipEnsureCtx();
    const ctx = chipAudioCtx;
    const sfx = chipGetSfx();
    const now = ctx.currentTime;
    [[523, 0], [659, 0.055], [784, 0.11]].forEach(([freq, delay]) => {
        const osc = ctx.createOscillator();
        const g   = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        osc.detune.setValueAtTime(12, now + delay);
        osc.detune.linearRampToValueAtTime(0, now + delay + 0.04);
        g.gain.setValueAtTime(0.5, now + delay);
        g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.12);
        osc.connect(g); g.connect(sfx);
        osc.start(now + delay); osc.stop(now + delay + 0.13);
    });
}

// Sell: descending chip arpeggio (G–E–C), slightly softer
function sfxSell() {
    chipEnsureCtx();
    const ctx = chipAudioCtx;
    const sfx = chipGetSfx();
    const now = ctx.currentTime;
    [[784, 0], [659, 0.055], [523, 0.11]].forEach(([freq, delay]) => {
        const osc = ctx.createOscillator();
        const g   = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.45, now + delay);
        g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.12);
        osc.connect(g); g.connect(sfx);
        osc.start(now + delay); osc.stop(now + delay + 0.13);
    });
}

// ── Music playback ────────────────────────────────────────────────────────────

// Helper: schedule a single note-on/off pair of events for one track
function chipScheduleTrack(events, startTime, secPerTick, noteOn, noteOff) {
    const active = {};
    events.forEach(ev => {
        const t = startTime + ev[0] * secPerTick;
        if (ev[1] === 'on') {
            active[ev[3]] = noteOn(ev[3], ev[4], t);
        } else {
            if (active[ev[3]]) { noteOff(active[ev[3]], ev[3], t); delete active[ev[3]]; }
        }
    });
}

// Intro = 1 bar. Loop body = bar 1 onwards. Both derived from parsed MIDI.
const CHIP_INTRO_END  = null; // set after loadMidi() → CHIP_MIDI.introEnd
const CHIP_LOOP_START = null; // set after loadMidi() → CHIP_MIDI.loopStart
const CHIP_LOOP_END   = null; // set after loadMidi() → CHIP_MIDI.loopEnd

// Play a slice of the MIDI (fromTick inclusive, toTick exclusive), scheduled
// to start at startTime. Returns the duration in seconds of that slice.
function chipPlaySlice(startTime, fromTick, toTick) {
    chipEnsureCtx();
    const ctx    = chipAudioCtx;
    const master = chipGetMaster();
    const { tpb, tempo, tracks } = CHIP_MIDI;
    const secPerTick = (tempo / 1000000) / tpb;

    // Filter events within [fromTick, toTick) and re-zero their times.
    // Also cap any note that starts inside the slice but whose note-off falls
    // outside it (e.g. a bass note at tick 1440 with off at 1584 when the
    // intro slice ends at 1536) — inject a synthetic off at the slice boundary
    // so the note doesn't bleed into the next slice and cause buzzing.
    const slice = (events) => {
        const result = [];
        const openNotes = {}; // note → true if a note-on has been seen with no matching off yet
        events.forEach(ev => {
            const tick = ev[0];
            if (tick >= fromTick && tick < toTick) {
                result.push([tick - fromTick, ...ev.slice(1)]);
                if (ev[1] === 'on')  openNotes[ev[3]] = true;
                if (ev[1] === 'off') delete openNotes[ev[3]];
            }
        });
        // For any note still open at the slice boundary, inject a note-off at toTick-fromTick
        const sliceLen = toTick - fromTick;
        Object.keys(openNotes).forEach(noteStr => {
            const note = parseInt(noteStr, 10);
            result.push([sliceLen, 'off', events.find(e => e[3] === note)?.[2] ?? 0, note]);
        });
        result.sort((a, b) => a[0] - b[0]);
        return result;
    };

    // ── Bass ─────────────────────────────────────────────────────────────────
    chipScheduleTrack(slice(tracks[0]), startTime, secPerTick,
        (note, vel, t) => {
            const osc = ctx.createOscillator(); const g = ctx.createGain();
            osc.type = 'square'; osc.frequency.value = midiToHz(note + 12);
            osc.detune.setValueAtTime(8, t); osc.detune.linearRampToValueAtTime(0, t + 0.03);
            g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.55, t + 0.008);
            osc.connect(g); g.connect(master); osc.start(t); return { osc, g };
        },
        ({ osc, g }, note, t) => {
            // Use the scheduled peak (0.55) not g.gain.value (which is 0 at schedule time)
            g.gain.setValueAtTime(0.55, t); g.gain.linearRampToValueAtTime(0, t + 0.015);
            osc.stop(t + 0.02);
        }
    );

    // ── Guitar / chords ───────────────────────────────────────────────────────
    chipScheduleTrack(slice(tracks[1]), startTime, secPerTick,
        (note, vel, t) => {
            return [0, 7].map(det => {
                const osc = ctx.createOscillator(); const g = ctx.createGain();
                osc.type = 'square'; osc.frequency.value = midiToHz(note + 12); osc.detune.value = det;
                g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.22, t + 0.01);
                osc.connect(g); g.connect(master); osc.start(t); return { osc, g };
            });
        },
        (nodes, note, t) => nodes.forEach(({ osc, g }) => {
            g.gain.setValueAtTime(0.22, t); g.gain.linearRampToValueAtTime(0, t + 0.04);
            osc.stop(t + 0.05);
        })
    );

    // ── Drums ─────────────────────────────────────────────────────────────────
    // Routed to chipGetDrum() — a dedicated bus at 0.85 so hits cut through the mix.
    const drum = chipGetDrum();
    slice(tracks[2]).forEach(ev => {
        if (ev[1] !== 'on') return;
        const t = startTime + ev[0] * secPerTick; const note = ev[3];

        if (note === 35) {
            // ── KICK: pitched sine punch + sub thump + clicky transient ──
            // Layer 1: fast pitch sweep (the "thump") — 200 Hz → 45 Hz in 80ms
            const osc1 = ctx.createOscillator(); const g1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(200, t);
            osc1.frequency.exponentialRampToValueAtTime(45, t + 0.08);
            g1.gain.setValueAtTime(1.0, t); g1.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            osc1.connect(g1); g1.connect(drum); osc1.start(t); osc1.stop(t + 0.19);

            // Layer 2: sub sine for low-end weight — stays at 50 Hz
            const osc2 = ctx.createOscillator(); const g2 = ctx.createGain();
            osc2.type = 'sine'; osc2.frequency.value = 50;
            g2.gain.setValueAtTime(0.8, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
            osc2.connect(g2); g2.connect(drum); osc2.start(t); osc2.stop(t + 0.23);

            // Layer 3: very short noise burst for the click attack
            const bsz3 = Math.ceil(ctx.sampleRate * 0.012);
            const buf3 = ctx.createBuffer(1, bsz3, ctx.sampleRate);
            const d3 = buf3.getChannelData(0); for (let i = 0; i < bsz3; i++) d3[i] = Math.random() * 2 - 1;
            const src3 = ctx.createBufferSource(); src3.buffer = buf3;
            const lpf3 = ctx.createBiquadFilter(); lpf3.type = 'lowpass'; lpf3.frequency.value = 3000;
            const g3 = ctx.createGain();
            g3.gain.setValueAtTime(0.6, t); g3.gain.exponentialRampToValueAtTime(0.001, t + 0.01);
            src3.connect(lpf3); lpf3.connect(g3); g3.connect(drum); src3.start(t); src3.stop(t + 0.013);

        } else if (note === 40) {
            // ── SNARE: noise body tuned with a bandpass + tonal "crack" oscillator ──
            // Layer 1: noise body — bandpass centred at 900 Hz, moderate Q to keep body + snap
            const bsz = Math.ceil(ctx.sampleRate * 0.22);
            const buf = ctx.createBuffer(1, bsz, ctx.sampleRate);
            const d = buf.getChannelData(0); for (let i = 0; i < bsz; i++) d[i] = Math.random() * 2 - 1;
            const src = ctx.createBufferSource(); src.buffer = buf;
            const bpf = ctx.createBiquadFilter(); bpf.type = 'bandpass'; bpf.frequency.value = 900; bpf.Q.value = 1.2;
            const g = ctx.createGain();
            g.gain.setValueAtTime(1.0, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
            src.connect(bpf); bpf.connect(g); g.connect(drum); src.start(t); src.stop(t + 0.22);

            // Layer 2: high-frequency sizzle for snare wire rattle
            const bsz2 = Math.ceil(ctx.sampleRate * 0.12);
            const buf2 = ctx.createBuffer(1, bsz2, ctx.sampleRate);
            const d2 = buf2.getChannelData(0); for (let i = 0; i < bsz2; i++) d2[i] = Math.random() * 2 - 1;
            const src2 = ctx.createBufferSource(); src2.buffer = buf2;
            const hpf2 = ctx.createBiquadFilter(); hpf2.type = 'highpass'; hpf2.frequency.value = 4000;
            const g2 = ctx.createGain();
            g2.gain.setValueAtTime(0.55, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            src2.connect(hpf2); hpf2.connect(g2); g2.connect(drum); src2.start(t); src2.stop(t + 0.12);

            // Layer 3: short tonal crack — square wave at 180 Hz for the chip "pop"
            const osc3 = ctx.createOscillator(); const g3 = ctx.createGain();
            osc3.type = 'square'; osc3.frequency.value = 180;
            g3.gain.setValueAtTime(0.45, t); g3.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
            osc3.connect(g3); g3.connect(drum); osc3.start(t); osc3.stop(t + 0.045);

        } else if (note === 42) {
            // ── CLOSED HI-HAT: tight noise burst, HPF at 6kHz, fast decay ──
            const bsz = Math.ceil(ctx.sampleRate * 0.08);
            const buf = ctx.createBuffer(1, bsz, ctx.sampleRate);
            const d = buf.getChannelData(0); for (let i = 0; i < bsz; i++) d[i] = Math.random() * 2 - 1;
            const src = ctx.createBufferSource(); src.buffer = buf;
            // HPF strips everything below 6kHz — gives that bright, crisp hi-hat zing
            const hpf = ctx.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 6000;
            // Shelf to boost the very top air
            const shelf = ctx.createBiquadFilter(); shelf.type = 'highshelf'; shelf.frequency.value = 10000; shelf.gain.value = 6;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
            src.connect(hpf); hpf.connect(shelf); shelf.connect(g); g.connect(drum);
            src.start(t); src.stop(t + 0.08);

        } else if (note === 69) {
            // ── SHAKER: every 1/8-beat (48 ticks). Strong/weak alternating accent.
            // Hits land every 48 ticks. Every OTHER hit is on a quarter-beat (strong).
            // We derive accent from tick position: ticks divisible by 96 = strong.
            const tickPos = ev[0];
            const isStrong = (tickPos % 96) === 0;
            const gainVal  = isStrong ? 0.55 : 0.28;   // strong / weak volume
            const decay    = isStrong ? 0.065 : 0.042; // strong lingers a touch longer

            // Noise source bandpass-shaped to sit in the shaker frequency pocket (~5–9 kHz)
            const bsz = Math.ceil(ctx.sampleRate * 0.055);
            const buf = ctx.createBuffer(1, bsz, ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < bsz; i++) d[i] = Math.random() * 2 - 1;
            const src = ctx.createBufferSource(); src.buffer = buf;

            // Two-stage filter: HPF to remove low mud, then a gentle peak around 7 kHz
            const hpf = ctx.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 5500;
            const peak = ctx.createBiquadFilter(); peak.type = 'peaking'; peak.frequency.value = 7000; peak.Q.value = 1.5; peak.gain.value = 5;

            const g = ctx.createGain();
            g.gain.setValueAtTime(gainVal, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + decay);

            src.connect(hpf); hpf.connect(peak); peak.connect(g); g.connect(drum);
            src.start(t); src.stop(t + decay + 0.005);
        }
    });

    // ── Synth lead ────────────────────────────────────────────────────────────
    const lead = chipGetLead();
    chipScheduleTrack(slice(tracks[3]), startTime, secPerTick,
        (note, vel, t) => {
            const osc = ctx.createOscillator(); const g = ctx.createGain();
            osc.type = 'triangle'; osc.frequency.value = midiToHz(note + 12);
            g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.38, t + 0.012);
            osc.connect(g); g.connect(lead); osc.start(t); return { osc, g };
        },
        ({ osc, g }, note, t) => {
            g.gain.setValueAtTime(0.38, t); g.gain.linearRampToValueAtTime(0, t + 0.03);
            osc.stop(t + 0.04);
        }
    );

    return (toTick - fromTick) * secPerTick;
}

function chipStartMusic() {
    if (chipStarted) return;
    chipStarted = true;
    chipEnsureCtx();

    loadMidi().then(() => {
        if (!chipStarted) return; // stopped while loading
        const introEnd  = CHIP_MIDI.introEnd;
        const loopStart = CHIP_MIDI.loopStart;
        const loopEnd   = CHIP_MIDI.loopEnd;

        // Capture t0 now so the loop is anchored to when the intro was scheduled,
        // not to whenever the setTimeout callback fires. Using ctx.currentTime
        // inside the callback adds ~introDur of extra delay (the audio clock has
        // already advanced by then) — that was the silent bar between intro and loop.
        const t0 = chipAudioCtx.currentTime;
        const introDur = chipPlaySlice(t0, 0, introEnd);
        const loopStartAt = t0 + introDur;

        function scheduleLoop(loopStartTime) {
            if (!chipStarted) return;
            // Guard against scheduling into the past (e.g. tab was backgrounded and
            // setTimeout fired late). If the loop start has already passed, snap it
            // forward to now + a small buffer so notes aren't discarded by the engine.
            const clampedStart = Math.max(loopStartTime, chipAudioCtx.currentTime + 0.02);
            const dur = chipPlaySlice(clampedStart, loopStart, loopEnd);
            // 300 ms lookahead — large enough to survive browser tab throttling
            // (which clamps setTimeout to ~1000 ms) without audible gap.
            chipLoopTimeout = setTimeout(() => scheduleLoop(clampedStart + dur), (dur - 0.3) * 1000);
        }
        chipLoopTimeout = setTimeout(() => scheduleLoop(loopStartAt), (introDur - 0.3) * 1000);
    }).catch(err => console.error('MIDI load failed:', err));
}

function chipStopMusic() {
    chipStarted = false;
    if (chipLoopTimeout) { clearTimeout(chipLoopTimeout); chipLoopTimeout = null; }
    if (chipAudioCtx) {
        const now = chipAudioCtx.currentTime;
        [chipMasterGain, chipDrumGain, chipLeadGain].forEach(g => {
            if (!g) return;
            g.gain.setValueAtTime(g.gain.value, now);
            g.gain.linearRampToValueAtTime(0, now + 0.3);
        });
        setTimeout(() => { chipMasterGain = null; chipDrumGain = null; chipLeadGain = null; }, 400);
    }
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
// Draw keyboard immediately so it's visible from frame 1
drawKeyboard();

// Browsers block AudioContext until a user gesture. We show a full-screen
// overlay on top of the console; the first tap/click dismisses it, starts
// the music, and kicks off the splash screen — all in the same gesture.
(function bootWithTap() {
    const overlay = document.createElement('div');
    Object.assign(overlay.style, {
        position: 'fixed', inset: '0', zIndex: '9999',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: 'transparent', cursor: 'pointer',
    });
    // Blinking "TAP TO START" label positioned at the bottom of the console area
    const label = document.createElement('div');
    Object.assign(label.style, {
        fontFamily: 'monospace', fontSize: '13px', color: '#ffffff',
        letterSpacing: '0.15em', opacity: '1',
        animation: 'tapBlink 0.9s step-start infinite',
        position: 'absolute', bottom: '18%',
    });
    label.textContent = 'TAP TO START';
    // Inject the blink keyframe once
    if (!document.getElementById('_tapBlinkStyle')) {
        const s = document.createElement('style');
        s.id = '_tapBlinkStyle';
        s.textContent = '@keyframes tapBlink { 0%,49%{opacity:1} 50%,100%{opacity:0} }';
        document.head.appendChild(s);
    }
    overlay.appendChild(label);
    document.body.appendChild(overlay);

    const start = () => {
        overlay.remove();
        chipStartMusic();
        showIntroScreen();
    };
    overlay.addEventListener('pointerdown', start, { once: true });
    overlay.addEventListener('keydown',     start, { once: true });
})();
</script>
</body>
