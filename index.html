<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperSeller8086 - Stock Trading Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #0a0e27;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0e27;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow: hidden;
            padding: 0;
        }

        .fullscreen-overlay.hidden {
            display: none;
        }

        .scroll-columns {
            display: flex;
            gap: 20px;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .scroll-column {
            font-size: 14px;
            text-align: center;
            white-space: pre;
            text-shadow: 0 0 10px #ffffff;
            letter-spacing: 0px;
            line-height: 1.2;
            max-width: 300px;
            padding: 20px;
            overflow: hidden;
            transform: translateY(-150vh);
        }

        .scroll-column:nth-child(1) { animation: columnScroll 6s ease-in-out 0s forwards; }
        .scroll-column:nth-child(2) { animation: columnScroll 6s ease-in-out 0.3s forwards; }
        .scroll-column:nth-child(3) { animation: columnScroll 6s ease-in-out 0.6s forwards; }

        @keyframes columnScroll {
            0% {
                transform: translateY(-150vh);
            }
            10% {
                transform: translateY(0);
            }
            80% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(150vh);
            }
        }

        .game-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            aspect-ratio: 1;
            max-width: 600px;
            background-color: #1a1f3a;
            border: 3px solid #ffffff;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
        }

        .game-header {
            background-color: #0a0e27;
            border-bottom: 2px solid #ffffff;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer {
            font-size: 16px;
            color: #ffffff;
        }

        .stock-market {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            border-bottom: 2px solid #ffffff;
            white-space: pre;
            word-wrap: break-word;
            font-size: 12px;
            line-height: 1.2;
            font-family: 'Courier New', monospace;
        }

        .stock-market::-webkit-scrollbar {
            width: 8px;
        }

        .stock-market::-webkit-scrollbar-track {
            background: #0a0e27;
        }

        .stock-market::-webkit-scrollbar-thumb {
            background: #ffffff;
            border-radius: 4px;
        }

        .game-input-area {
            display: flex;
            gap: 5px;
            padding: 15px;
            background-color: #0a0e27;
            flex-direction: column;
        }

        .command-row {
            display: flex;
            gap: 5px;
        }

        .game-input {
            flex: 1;
            background-color: #1a1f3a;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            outline: none;
        }

        .game-input:focus {
            box-shadow: 0 0 5px #ffffff;
        }

        button {
            background-color: #ffffff;
            color: #0a0e27;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            border-radius: 3px;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #cccccc;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        button:active {
            transform: scale(0.95);
        }

        .command-info {
            font-size: 12px;
            color: #ffffff;
            margin-top: 10px;
            text-align: center;
        }

        .player-stats {
            background-color: #0a0e27;
            border-top: 1px solid #ffffff;
            padding: 10px 15px;
            font-size: 12px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }

        .results-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0e27;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            flex-direction: column;
            gap: 30px;
            padding: 20px;
        }

        .results-screen.show {
            display: flex;
        }

        .results-content {
            text-align: center;
            white-space: pre;
            font-size: 16px;
            line-height: 1.6;
            max-width: 500px;
            text-shadow: 0 0 10px #ffffff;
        }

        .results-button {
            background-color: #ffffff;
            color: #0a0e27;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            border-radius: 3px;
            transition: all 0.3s;
        }

        .results-button:hover {
            background-color: #cccccc;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="fullscreen-overlay" id="overlay">
        <div class="scroll-columns" id="scrollColumns"></div>
    </div>

    <div class="results-screen" id="resultsScreen">
        <div class="results-content" id="resultsContent"></div>
        <button class="results-button" onclick="startNewRound()">NEXT ROUND</button>
    </div>

    <div class="game-wrapper">
        <div class="game-container">
            <div class="game-header">
                <span>> RED <span id="redPrice">$45.00</span> <</span>
                <span class="timer">Time: <span id="roundTimer">30</span>s</span>
            </div>
            <div class="stock-market" id="stockMarket"></div>
            <div class="player-stats" id="playerStats">Cash: $1000 | Shares: 0 | Value: $0</div>
            <div class="game-input-area">
                <div class="command-row">
                    <input 
                        type="text" 
                        class="game-input" 
                        id="commandInput" 
                        placeholder="Enter quantity..."
                        autocomplete="off"
                    >
                    <button onclick="submitCommand()">SUBMIT</button>
                </div>
                <div class="command-info">
                    Q: Buy | A: Sell
                </div>
            </div>
        </div>
    </div>

    <script>
        const introScreens = [
            `> SUPERSELLER8086 <

███████████████████████
███████████████████████
███████████████████████
███████████████████████`,
            
            `WELCOME TO 
STOCK TRADING
        
Each round: 30s

Unsold stocks
EXPIRE at $0
value!

Buy & sell fast!`,

            `Buy (q)
Sell (a)

Press ENTER
to START`
        ];

        let currentScreen = 0;
        let waitingForEnter = false;

        function showNextScreen() {
            if (currentScreen < introScreens.length) {
                const scrollColumns = document.getElementById('scrollColumns');
                scrollColumns.innerHTML = '';
                
                // Split text into columns
                const lines = introScreens[currentScreen].split('\n');
                const columnCount = 3;
                const linesPerColumn = Math.ceil(lines.length / columnCount);
                
                for (let i = 0; i < columnCount; i++) {
                    const columnText = lines.slice(i * linesPerColumn, (i + 1) * linesPerColumn).join('\n');
                    const column = document.createElement('div');
                    column.className = 'scroll-column';
                    column.textContent = columnText;
                    scrollColumns.appendChild(column);
                }

                currentScreen++;
                
                if (currentScreen === introScreens.length) {
                    waitingForEnter = true;
                } else {
                    setTimeout(showNextScreen, 6100);
                }
            }
        }

        // Stock data
        const stock = {
            price: 45,
            volatility: 0.15,
            history: [45]
        };

        let player = {
            cash: 1000,
            shares: 0,
            startingCash: 1000
        };

        let roundTime = 30;
        let roundInterval = null;
        let currentMode = null; // 'buy' or 'sell'
        let roundActive = false;

        function updateStockPrice() {
            const changePercent = (Math.random() - 0.5) * stock.volatility;
            const newPrice = Math.max(1, stock.price * (1 + changePercent));
            stock.price = parseFloat(newPrice.toFixed(2));
            stock.history.push(stock.price);
            
            document.getElementById('redPrice').textContent = `$${stock.price.toFixed(2)}`;
            updateMarketDisplay();
        }

        function displayStockChart(height = 12) {
            const history = stock.history.slice(-40);
            const maxPrice = Math.max(...history);
            const minPrice = Math.min(...history);
            const range = maxPrice - minPrice || 1;

            let chart = '';
            for (let i = 0; i < height; i++) {
                let line = '';
                for (let j = 0; j < history.length; j++) {
                    const normalized = (history[j] - minPrice) / range;
                    const barHeight = Math.round(normalized * (height - 1));
                    
                    if (barHeight >= (height - 1 - i)) {
                        line += '·';
                    } else {
                        line += ' ';
                    }
                }
                chart += line + '\n';
            }
            return chart;
        }

        function updateMarketDisplay() {
            let display = displayStockChart(12);
            document.getElementById('stockMarket').textContent = display;
            document.getElementById('stockMarket').scrollTop = document.getElementById('stockMarket').scrollHeight;
        }

        function updatePlayerStats() {
            const portfolioValue = player.shares * stock.price;
            document.getElementById('playerStats').textContent = 
                `Cash: $${player.cash.toFixed(2)} | Shares: ${player.shares} | Value: $${portfolioValue.toFixed(2)}`;
        }

        function startRound() {
            roundActive = true;
            roundTime = 30;
            stock.history = [stock.price];
            updateMarketDisplay();
            updatePlayerStats();
            waitingForEnter = false;

            if (roundInterval) clearInterval(roundInterval);

            roundInterval = setInterval(() => {
                roundTime--;
                document.getElementById('roundTimer').textContent = roundTime;
                updateStockPrice();

                if (roundTime <= 0) {
                    endRound();
                }
            }, 1000);
        }

        function endRound() {
            clearInterval(roundInterval);
            roundActive = false;
            currentMode = null;
            
            const portfolioValue = player.shares * stock.price;
            const totalValue = player.cash + portfolioValue;
            const profit = totalValue - player.startingCash;
            const profitPercent = ((profit / player.startingCash) * 100).toFixed(1);

            let resultsText = `ROUND OVER

Final Price: $${stock.price.toFixed(2)}
Unsold Shares: ${player.shares}

Cash: $${player.cash.toFixed(2)}
Portfolio Value: $${portfolioValue.toFixed(2)}
Total: $${totalValue.toFixed(2)}

Profit: $${profit.toFixed(2)} (${profitPercent}%)`;

            document.getElementById('resultsContent').textContent = resultsText;
            document.getElementById('resultsScreen').classList.add('show');
        }

        function startNewRound() {
            document.getElementById('resultsScreen').classList.remove('show');
            
            player.cash = 1000;
            player.shares = 0;
            player.startingCash = 1000;
            stock.price = 45;
            stock.history = [45];
            stock.volatility = 0.15;
            
            startRound();
        }

        function buyStock(quantity) {
            if (!quantity || quantity <= 0) return 'Invalid quantity!';

            const cost = stock.price * quantity;
            if (cost > player.cash) {
                return `Insufficient funds!`;
            }

            player.cash -= cost;
            player.shares += quantity;
            updatePlayerStats();
            currentMode = null;
            document.getElementById('commandInput').value = '';
            return `✓ Bought ${quantity} RED @ $${stock.price.toFixed(2)}`;
        }

        function sellStock(quantity) {
            if (!quantity || quantity <= 0) return 'Invalid quantity!';
            if (player.shares < quantity) {
                return `Only have ${player.shares} shares!`;
            }

            const proceeds = stock.price * quantity;
            player.cash += proceeds;
            player.shares -= quantity;
            updatePlayerStats();
            currentMode = null;
            document.getElementById('commandInput').value = '';
            return `✓ Sold ${quantity} RED for $${proceeds.toFixed(2)}`;
        }

        function submitCommand() {
            if (waitingForEnter) {
                document.getElementById('overlay').classList.add('hidden');
                startRound();
                return;
            }

            if (!roundActive) return;

            const input = document.getElementById('commandInput');
            const command = input.value.trim();

            if (!command) return;

            let output = '';
            
            if (currentMode === 'buy') {
                const quantity = parseInt(command);
                output = buyStock(quantity);
            } else if (currentMode === 'sell') {
                const quantity = parseInt(command);
                output = sellStock(quantity);
            } else {
                output = 'Unknown command.';
            }

            if (output) {
                const stockMarket = document.getElementById('stockMarket');
                stockMarket.textContent += '\n$ ' + command + '\n' + output + '\n';
                stockMarket.scrollTop = stockMarket.scrollHeight;
            }

            input.value = '';
            input.focus();
        }

        // Handle Q and A key presses
        document.addEventListener('keydown', function(e) {
            if (!roundActive) return;
            
            if (e.key === 'q' || e.key === 'Q') {
                e.preventDefault();
                currentMode = 'buy';
                document.getElementById('commandInput').focus();
                document.getElementById('commandInput').value = '';
            } else if (e.key === 'a' || e.key === 'A') {
                e.preventDefault();
                currentMode = 'sell';
                document.getElementById('commandInput').focus();
                document.getElementById('commandInput').value = '';
            }
        });

        document.getElementById('commandInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitCommand();
            }
        });

        function initializeGame() {
            updateMarketDisplay();
            updatePlayerStats();
            document.getElementById('commandInput').focus();
        }

        // Start intro sequence
        showNextScreen();
    </script>
</body>
</html>
