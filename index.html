<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperSeller8086 - Stock Trading Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #0a0e27;
            color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0e27;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow: hidden;
            padding: 20px;
        }

        .fullscreen-overlay.hidden {
            display: none;
        }

        .intro-console {
            width: 100%;
            aspect-ratio: 1;
            max-width: 600px;
            background-color: #1a1f3a;
            border: 3px solid #ffffff;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            display: grid;
            grid-template-columns: repeat(40, 1fr);
            grid-template-rows: repeat(30, 1fr);
            padding: 0;
            gap: 0;
            overflow: hidden;
            position: relative;
        }

        .console-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(8px, 1.2vw, 20px);
            line-height: 1;
            text-shadow: 0 0 5px #ffffff;
            white-space: pre;
            aspect-ratio: 1;
            position: relative;
        }

        .game-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            aspect-ratio: 1;
            max-width: 600px;
            background-color: #1a1f3a;
            border: 3px solid #ffffff;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            display: grid;
            grid-template-columns: repeat(40, 1fr);
            grid-template-rows: repeat(30, 1fr);
            padding: 0;
            gap: 0;
            overflow: hidden;
            position: relative;
        }

        .game-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(8px, 1.2vw, 20px);
            line-height: 1;
            text-shadow: 0 0 5px #ffffff;
            white-space: pre;
            aspect-ratio: 1;
            border-bottom: 1px solid #0a0e27;
            border-right: 1px solid #0a0e27;
        }

        .results-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0e27;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            flex-direction: column;
            gap: 30px;
            padding: 20px;
        }

        .results-screen.show {
            display: flex;
        }

        .results-console {
            width: 100%;
            aspect-ratio: 1;
            max-width: 600px;
            background-color: #1a1f3a;
            border: 3px solid #ffffff;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            display: grid;
            grid-template-columns: repeat(40, 1fr);
            grid-template-rows: repeat(30, 1fr);
            padding: 0;
            gap: 0;
            overflow: hidden;
            position: relative;
        }

        .results-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(8px, 1.2vw, 20px);
            line-height: 1;
            text-shadow: 0 0 5px #ffffff;
            white-space: pre;
            aspect-ratio: 1;
        }

        .results-button {
            background-color: #ffffff;
            color: #0a0e27;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            border-radius: 3px;
            transition: all 0.3s;
        }

        .results-button:hover {
            background-color: #cccccc;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(100%);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="fullscreen-overlay" id="overlay">
        <div class="intro-console" id="introConsole"></div>
    </div>

    <div class="results-screen" id="resultsScreen">
        <div class="results-console" id="resultsConsole"></div>
        <button class="results-button" onclick="handleResultsEnter()">NEXT</button>
    </div>

    <div class="game-wrapper">
        <div class="game-container" id="gameConsole"></div>
    </div>

    <script>
        // 40x30 grid intro screens
        const introScreens = [
            // Screen 1: Title
            [
                "                                        ",
                "                                        ",
                "                                        ",
                "    > SUPERSELLER8086 <                 ",
                "                                        ",
                "    █████████████████                   ",
                "    █████████████████                   ",
                "    █████████████████                   ",
                "    █████████████████                   ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "    Press ENTER to continue             "
            ],
            // Screen 2: Warning
            [
                "                                        ",
                "    WELCOME TO STOCK TRADING             ",
                "                                        ",
                "    WARNING: 30 seconds per round        ",
                "                                        ",
                "    Unsold stocks EXPIRE and become      ",
                "    WORTHLESS ($0 value)                ",
                "                                        ",
                "    Buy & sell quickly to maximize       ",
                "    profits before expiration!          ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "    Press ENTER to continue             "
            ],
            // Screen 3: Instructions
            [
                "                                        ",
                "                                        ",
                "                                        ",
                "         BUY (Q) / SELL (A)              ",
                "                                        ",
                "     Watch the price and trade          ",
                "                                        ",
                "     Q = Buy  |  A = Sell                ",
                "                                        ",
                "     Type quantity then ENTER            ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "                                        ",
                "    Press ENTER to continue             "
            ]
        ];

        let currentScreen = 0;
        let waitingForEnter = false;
        let gameActive = false;

        function renderStaticGrid(lines, container) {
            container.innerHTML = '';
            for (let row = 0; row < 30; row++) {
                const line = lines[row] || '';
                for (let col = 0; col < 40; col++) {
                    const cell = document.createElement('div');
                    cell.className = container.id === 'introConsole' ? 'console-cell' : 'game-cell';
                    cell.textContent = line[col] || ' ';
                    cell.style.gridColumn = col + 1;
                    cell.style.gridRow = row + 1;
                    
                    // Calculate animation for intro screens
                    if (container.id === 'introConsole') {
                        const char = line[col];
                        if (char && char !== ' ') {
                            const delay = col * 0.02 + (row * 0.01);
                            cell.style.animation = `slideDown 0.8s ease-out ${delay}s both`;
                        }
                    }
                    
                    container.appendChild(cell);
                }
            }
        }

        function showIntroScreen() {
            if (currentScreen < introScreens.length) {
                renderStaticGrid(introScreens[currentScreen], document.getElementById('introConsole'));
                waitingForEnter = true;
                currentScreen++;
            } else {
                startGameplay();
            }
        }

        function startGameplay() {
            document.getElementById('overlay').classList.add('hidden');
            gameActive = true;
            startRound();
        }

        // Stock data
        const stock = {
            price: 45,
            volatility: 0.15,
            history: [45]
        };

        let player = {
            cash: 1000,
            shares: 0,
            startingCash: 1000
        };

        let roundTime = 30;
        let roundInterval = null;
        let currentMode = null; // 'buy' or 'sell'

        function buildGameGrid() {
            const lines = Array(30).fill('').map(() => Array(40).fill(' ').join(''));
            
            // Convert to array for manipulation
            const grid = lines.split('\n').map(line => line.split(''));

            // Header: price and timer
            const header = `RED $${stock.price.toFixed(2)}`;
            const timerStr = `${roundTime}s`;
            
            header.split('').forEach((char, i) => {
                if (i < 20) grid[0][i] = char;
            });
            timerStr.split('').forEach((char, i) => {
                if (i + 30 < 40) grid[0][30 + i] = char;
            });

            // Separator
            for (let i = 0; i < 40; i++) grid[1][i] = '─';

            // Chart (rows 3-15)
            const chartStart = 3;
            const chartHeight = 10;
            const history = stock.history.slice(-38);
            const maxPrice = Math.max(...history);
            const minPrice = Math.min(...history);
            const range = maxPrice - minPrice || 1;

            for (let i = 0; i < chartHeight; i++) {
                for (let j = 0; j < Math.min(history.length, 38); j++) {
                    const normalized = (history[j] - minPrice) / range;
                    const barHeight = Math.round(normalized * (chartHeight - 1));
                    grid[chartStart + chartHeight - 1 - i][j + 1] = barHeight >= (chartHeight - 1 - i) ? '·' : ' ';
                }
            }

            // Separator
            for (let i = 0; i < 40; i++) grid[16][i] = '─';

            // Mode display
            if (currentMode) {
                const modeText = currentMode === 'buy' ? 'BUY MODE' : 'SELL MODE';
                modeText.split('').forEach((char, i) => {
                    if (i < 40) grid[18][i] = char;
                });
            }

            // Stats
            const cash = `Cash: $${player.cash.toFixed(2)}`;
            const shares = `Shares: ${player.shares}`;
            const value = `Value: $${(player.shares * stock.price).toFixed(2)}`;
            
            cash.split('').forEach((char, i) => { if (i < 40) grid[20][i] = char; });
            shares.split('').forEach((char, i) => { if (i < 40) grid[21][i] = char; });
            value.split('').forEach((char, i) => { if (i < 40) grid[22][i] = char; });

            // Separator
            for (let i = 0; i < 40; i++) grid[27][i] = '─';

            // Instructions
            const instruct1 = 'Q: Buy | A: Sell';
            instruct1.split('').forEach((char, i) => { if (i < 40) grid[28][i] = char; });

            const instruct2 = currentMode ? 'Enter qty and press ENTER' : 'Press Q or A to trade';
            instruct2.split('').forEach((char, i) => { if (i < 40) grid[29][i] = char; });

            return grid.map(row => row.join(''));
        }

        function updateGameDisplay() {
            renderStaticGrid(buildGameGrid(), document.getElementById('gameConsole'));
        }

        function updateStockPrice() {
            const changePercent = (Math.random() - 0.5) * stock.volatility;
            const newPrice = Math.max(1, stock.price * (1 + changePercent));
            stock.price = parseFloat(newPrice.toFixed(2));
            stock.history.push(stock.price);
            updateGameDisplay();
        }

        function startRound() {
            roundTime = 30;
            stock.history = [stock.price];
            currentMode = null;
            updateGameDisplay();

            if (roundInterval) clearInterval(roundInterval);

            roundInterval = setInterval(() => {
                roundTime--;
                updateGameDisplay();

                if (roundTime <= 0) {
                    endRound();
                }
            }, 1000);
        }

        function endRound() {
            clearInterval(roundInterval);
            gameActive = false;
            
            const portfolioValue = player.shares * stock.price;
            const totalValue = player.cash + portfolioValue;
            const profit = totalValue - player.startingCash;
            const profitPercent = ((profit / player.startingCash) * 100).toFixed(1);

            const results = [
                "ROUND OVER",
                "",
                `Final: $${stock.price.toFixed(2)}`,
                `Unsold: ${player.shares}`,
                "",
                `Cash: $${player.cash.toFixed(2)}`,
                `Portfolio: $${portfolioValue.toFixed(2)}`,
                `Total: $${totalValue.toFixed(2)}`,
                "",
                `Profit: $${profit.toFixed(2)}`,
                `(${profitPercent}%)`
            ];

            // Pad to 30 lines
            while (results.length < 30) {
                results.push('');
            }

            renderStaticGrid(results, document.getElementById('resultsConsole'));
            document.getElementById('resultsScreen').classList.add('show');
        }

        function handleResultsEnter() {
            document.getElementById('resultsScreen').classList.remove('show');
            
            player.cash = 1000;
            player.shares = 0;
            player.startingCash = 1000;
            stock.price = 45;
            stock.history = [45];
            stock.volatility = 0.15;
            gameActive = true;
            
            startRound();
        }

        function buyStock(quantity) {
            if (!quantity || quantity <= 0) return false;

            const cost = stock.price * quantity;
            if (cost > player.cash) return false;

            player.cash -= cost;
            player.shares += quantity;
            return true;
        }

        function sellStock(quantity) {
            if (!quantity || quantity <= 0) return false;
            if (player.shares < quantity) return false;

            const proceeds = stock.price * quantity;
            player.cash += proceeds;
            player.shares -= quantity;
            return true;
        }

        function submitCommand() {
            if (waitingForEnter) {
                waitingForEnter = false;
                showIntroScreen();
                return;
            }

            if (!gameActive || !currentMode) return;

            const quantity = parseInt(prompt(`Enter quantity to ${currentMode}:`));
            
            let success = false;
            
            if (currentMode === 'buy') {
                success = buyStock(quantity);
            } else if (currentMode === 'sell') {
                success = sellStock(quantity);
            }

            if (success) {
                currentMode = null;
                updateGameDisplay();
            }
        }

        // Handle key presses
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitCommand();
                return;
            }

            if (waitingForEnter) return;
            if (!gameActive) return;
            
            if (e.key === 'q' || e.key === 'Q') {
                e.preventDefault();
                currentMode = currentMode === 'buy' ? null : 'buy';
                updateGameDisplay();
            } else if (e.key === 'a' || e.key === 'A') {
                e.preventDefault();
                currentMode = currentMode === 'sell' ? null : 'sell';
                updateGameDisplay();
            }
        });

        // Start intro sequence
        showIntroScreen();
    </script>
</body>
</html>
