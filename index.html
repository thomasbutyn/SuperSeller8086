<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperSeller8086 - Stock Trading Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        html, body { width: 100%; height: 100%; background: #0a0e27; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .console-wrap {
            position: relative;
            width: min(100vw, calc(100dvh * 40 / 40));
            max-width: 600px;
            aspect-ratio: 40 / 40;
            border: 3px solid #ffffff;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a1f3a;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .text-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .overlay-row {
            position: absolute;
            left: 0; right: 0;
            white-space: pre;
            overflow: hidden;
            color: transparent;
            background: transparent;
            font-family: monospace;
            user-select: none;
            pointer-events: none;
        }

        .screen {
            position: fixed; inset: 0;
            background: #0a0e27;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            padding: 12px;
        }
        .screen.hidden { display: none; }

        #resultsScreen { flex-direction: column; gap: 16px; z-index: 999; }

        .results-button {
            background: #ffffff; color: #0a0e27;
            border: none; padding: 15px 30px;
            font-family: monospace; font-size: 12px;
            border-radius: 3px; cursor: pointer; transition: all 0.3s;
        }
        .results-button:hover { background: #cccccc; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        #cursor { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 99999; }
    </style>
</head>
<body>

<div id="cursor"><svg id="cursorSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>

<div id="qtyModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:2000;">
    <div style="background:#1a1f3a;border:2px solid #fff;border-radius:5px;padding:24px 32px;display:flex;flex-direction:column;align-items:center;gap:14px;font-family:monospace;color:#fff;min-width:240px;">
        <div id="qtyLabel" style="font-size:14px;letter-spacing:1px;">ENTER QUANTITY</div>
        <input type="number" id="qtyInput" min="1" value="1" inputmode="numeric" style="background:#0a0e27;color:#fff;border:1px solid #fff;border-radius:3px;font-family:monospace;font-size:20px;width:120px;text-align:center;padding:6px;" />
        <div style="display:flex;gap:12px;">
            <button onclick="closeQtyModal()" style="background:#555;color:#fff;border:none;padding:10px 22px;font-family:monospace;font-size:12px;border-radius:3px;">CANCEL</button>
            <button onclick="confirmQty()" style="background:#fff;color:#0a0e27;border:none;padding:10px 22px;font-family:monospace;font-size:12px;border-radius:3px;">OK</button>
        </div>
    </div>
</div>

<div class="screen" id="introScreen">
    <div class="console-wrap" id="introWrap">
        <canvas id="introCanvas"></canvas>
        <div class="text-overlay" id="introOverlay"></div>
    </div>
</div>

<div class="screen hidden" id="resultsScreen">
    <div class="console-wrap" id="resultsWrap">
        <canvas id="resultsCanvas"></canvas>
        <div class="text-overlay" id="resultsOverlay"></div>
    </div>
    <button class="results-button" onclick="handleResultsEnter()">NEXT</button>
</div>

<div class="screen hidden" id="gameScreen">
    <div class="console-wrap" id="gameWrap">
        <canvas id="gameCanvas"></canvas>
        <div class="text-overlay" id="gameOverlay"></div>
    </div>
</div>

<script>
// ─── GRID CONSTANTS ───────────────────────────────────────────────────────────
const COLS = 40, ROWS = 40;

// ─── 2D GRID HELPERS ──────────────────────────────────────────────────────────
const makeGrid   = () => Array.from({ length: ROWS }, () => Array(COLS).fill(' '));
const parseGrid  = lines => Array.from({ length: ROWS }, (_, r) => {
    const line = (lines[r] ?? '').trimStart();
    return Array.from({ length: COLS }, (_, c) => line[c] ?? ' ');
});
const writeStr   = (g, row, col, str) =>
    str.split('').forEach((ch, i) => { if (col + i < COLS) g[row][col + i] = ch; });
const fillRow    = (g, row, ch) => { for (let c = 0; c < COLS; c++) g[row][c] = ch; };
const writeCenter = (g, row, str) =>
    writeStr(g, row, Math.floor((COLS - str.length) / 2), str);

// ─── CANVAS RENDERER ──────────────────────────────────────────────────────────
/**
 * Each console is backed by a <canvas> + an invisible text overlay.
 * We store a Console object per screen to keep state together.
 *
 * Drawing:
 *   charW = canvas.width  / COLS   (exact pixel width per column)
 *   charH = canvas.height / ROWS   (exact pixel height per row)
 *   Each character is drawn at:
 *     x = col * charW + charW/2   (center of cell, textAlign='center')
 *     y = row * charH + charH/2   (center of cell, textBaseline='middle')
 *
 * This means column positions are pure arithmetic — the font cannot shift them.
 *
 * The canvas is sized to its CSS pixel size via a ResizeObserver, keeping the
 * backing buffer matching the display size exactly (no blur, no scaling artifact).
 */
class ConsoleRenderer {
    constructor(canvasEl, overlayEl) {
        this.canvas      = canvasEl;
        this.overlay     = overlayEl;
        this.ctx         = canvasEl.getContext('2d');
        this._grid       = makeGrid();
        this._colors     = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
        this._lastGrid   = null;   // cached for re-render on resize
        this._lastColors = null;
        this._lastIsGame = false;

        // Match canvas buffer to CSS size
        this._ro = new ResizeObserver(() => this._resize());
        this._ro.observe(canvasEl);
        this._resize();

        // Build overlay rows
        for (let r = 0; r < ROWS; r++) {
            const div = document.createElement('div');
            div.className = 'overlay-row';
            div.id = `${canvasEl.id}-row-${r}`;
            this.overlay.appendChild(div);
        }
        this._positionOverlay();
    }

    _resize() {
        const rect = this.canvas.getBoundingClientRect();
        const w = Math.round(rect.width);
        const h = Math.round(rect.height);
        if (!w || !h) return; // not yet laid out — ResizeObserver will fire again
        this.canvas.width  = w;
        this.canvas.height = h;
        this._positionOverlay();
        if (this._lastGrid) this.render(this._lastGrid, this._lastColors, this._lastIsGame);
    }

    _positionOverlay() {
        const cw = this.canvas.width  || this.canvas.offsetWidth;
        const ch = this.canvas.height || this.canvas.offsetHeight;
        const charH = ch / ROWS;
        const fontSize = charH * 0.95; // match canvas font size

        Array.from(this.overlay.children).forEach((div, r) => {
            div.style.top        = `${(r / ROWS * 100)}%`;
            div.style.height     = `${(1 / ROWS * 100)}%`;
            div.style.fontSize   = `${fontSize}px`;
            div.style.lineHeight = `${charH}px`;
        });
    }

    /** Render a grid+colorGrid, diffing against last frame for the overlay */
    render(grid, colorGrid = null, isGame = false) {
        this._lastGrid   = grid;
        this._lastColors = colorGrid;
        this._lastIsGame = isGame;

        const cw = this.canvas.width;
        const ch = this.canvas.height;
        const charW = cw / COLS;
        const charH = ch / ROWS;

        const ctx = this.ctx;
        ctx.clearRect(0, 0, cw, ch);

        // Background
        ctx.fillStyle = '#1a1f3a';
        ctx.fillRect(0, 0, cw, ch);

        // Game grid lines
        if (isGame) {
            ctx.strokeStyle = '#0a0e27';
            ctx.lineWidth = 1;
            for (let r = 1; r < ROWS; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * charH);
                ctx.lineTo(cw, r * charH);
                ctx.stroke();
            }
        }

        /*
         * Font sizing: charH * 0.72 keeps the glyph within the cell vertically.
         * We use a system monospace stack so the font is always available and
         * renders quickly, but the key point is that we don't use font metrics
         * for positioning — x/y come from col*charW and row*charH.
         */
        const fontSize = Math.floor(charH * 0.95);
        ctx.font = `${fontSize}px "Courier New", Courier, monospace`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';

        const overlayRows = this.overlay.children;

        for (let r = 0; r < ROWS; r++) {
            let rowText = '';

            for (let c = 0; c < COLS; c++) {
                const ch_  = grid[r][c];
                const color = colorGrid?.[r]?.[c] ?? null;

                const glowColor = color ?? '#ffffff';
                ctx.fillStyle = color ?? '#ffffff';
                const x = c * charW + charW / 2, y = r * charH + charH / 2;
                ctx.shadowColor = glowColor;
                ctx.shadowBlur = 10; ctx.globalAlpha = 0.4; ctx.fillText(ch_, x, y);
                ctx.shadowBlur = 5;  ctx.globalAlpha = 0.7; ctx.fillText(ch_, x, y);
                ctx.shadowBlur = 2;  ctx.globalAlpha = 1.0; ctx.fillText(ch_, x, y);
                ctx.shadowBlur = 0;  ctx.fillText(ch_, x, y);

                rowText += ch_;
            }

            // Update overlay row text for selection (only if changed)
            if (overlayRows[r] && overlayRows[r].textContent !== rowText) {
                overlayRows[r].textContent = rowText;
            }
        }

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
    }
}

// ─── CONSOLE INSTANCES ────────────────────────────────────────────────────────
const introRenderer   = new ConsoleRenderer(
    document.getElementById('introCanvas'),
    document.getElementById('introOverlay')
);
const resultsRenderer = new ConsoleRenderer(
    document.getElementById('resultsCanvas'),
    document.getElementById('resultsOverlay')
);
const gameRenderer    = new ConsoleRenderer(
    document.getElementById('gameCanvas'),
    document.getElementById('gameOverlay')
);

// ─── CHARACTER KEYBOARD ───────────────────────────────────────────────────────
// Keyboard occupies rows 30–37 (8 rows). Layout:
//   Row 30: separator ═══
//   Rows 31-32: Q  W  E  R  (each key is 10 cols wide)
//   Rows 33-34: A  S  D  F
//   Rows 35-37: ENTER (full width)

const KB_TOP = 30;  // first row of keyboard area

// Key definitions: label, grid col start (0-based in 40-col grid), key value, normal color, pressed color
const KB_KEYS = [
    // Row 1: Q W E R  — cols split into 4 × 10
    { label: 'Q-BUY', row: 0, c1: 0,  c2: 9,  key: 'q', norm: '#22cc22', pressed: '#88ff88', bg: '#001800', pbg: '#003a00' },
    { label: 'W-BUY', row: 0, c1: 10, c2: 19, key: 'w', norm: '#cc2222', pressed: '#ff8888', bg: '#180000', pbg: '#3a0000' },
    { label: 'E-BUY', row: 0, c1: 20, c2: 29, key: 'e', norm: '#2255cc', pressed: '#88aaff', bg: '#000018', pbg: '#00003a' },
    { label: 'R-BUY', row: 0, c1: 30, c2: 39, key: 'r', norm: '#ccaa00', pressed: '#ffee88', bg: '#181000', pbg: '#3a2800' },
    // Row 2: A S D F
    { label: 'A-SELL', row: 1, c1: 0,  c2: 9,  key: 'a', norm: '#88bb88', pressed: '#aaddaa', bg: '#0d1a0d', pbg: '#1a301a' },
    { label: 'S-SELL', row: 1, c1: 10, c2: 19, key: 's', norm: '#bb8888', pressed: '#ddaaaa', bg: '#1a0d0d', pbg: '#30191a' },
    { label: 'D-SELL', row: 1, c1: 20, c2: 29, key: 'd', norm: '#8899bb', pressed: '#aabbdd', bg: '#0d0d1a', pbg: '#19193a' },
    { label: 'F-SELL', row: 1, c1: 30, c2: 39, key: 'f', norm: '#bbaa77', pressed: '#ddccaa', bg: '#1a160a', pbg: '#302a14' },
    // ENTER: row 2, full width
    { label: 'ENTER', row: 2, c1: 0, c2: 39, key: 'Enter', norm: '#ffffff', pressed: '#ffffff', bg: '#111111', pbg: '#444444' },
];

// Key press state: key → expiry timestamp
const kbPressed = {};

function flashKey(keyVal) {
    kbPressed[keyVal] = Date.now() + 150;
}

function isKeyPressed(keyVal) {
    return kbPressed[keyVal] && Date.now() < kbPressed[keyVal];
}

// Row bands: rows 0 & 1 are 3 grid rows tall each, ENTER (row 2) gets the rest
// row 0 → grid rows 31-33, row 1 → 34-36, row 2 → 37 (1 row, clamped to grid)
function kbGridRow(logicalRow) {
    if (logicalRow === 2) return KB_TOP + 1 + 2 * 3; // row 37
    return KB_TOP + 1 + logicalRow * 3;
}

function drawKeyboard(g, col) {
    // ── Colour counters (rows KB_TOP-3 to KB_TOP-1, 4 boxes each 10 cols wide) ──
    const counterTop = KB_TOP - 2;
    const COUNTERS = [
        { val: player.green,  norm: '#22cc22', bright: '#88ff88', c1: 0,  c2: 9  },
        { val: player.red,    norm: '#cc2222', bright: '#ff8888', c1: 10, c2: 19 },
        { val: player.blue,   norm: '#2255cc', bright: '#88aaff', c1: 20, c2: 29 },
        { val: player.yellow, norm: '#ccaa00', bright: '#ffee88', c1: 30, c2: 39 },
    ];
    COUNTERS.forEach(({ val, norm, bright, c1, c2 }) => {
        const setC = (r, c, ch, clr) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS) { g[r][c] = ch; col[r][c] = clr; } };
        const r1 = counterTop, r2 = counterTop + 2;
        // Ordered perimeter: top L→R, right T→B, bottom R→L, left B→T
        const perim = [];
        for (let c = c1; c <= c2; c++) perim.push([r1, c]);
        for (let r = r1 + 1; r <= r2; r++) perim.push([r, c2]);
        for (let c = c2 - 1; c >= c1; c--) perim.push([r2, c]);
        for (let r = r2 - 1; r > r1; r--) perim.push([r, c1]);
        const P = perim.length;
        const cornerMap = { [`${r1},${c1}`]:'┌', [`${r1},${c2}`]:'┐', [`${r2},${c1}`]:'└', [`${r2},${c2}`]:'┘' };
        const edgeChar = (r, c) => (r === r1 || r === r2) ? '─' : '│';
        const t = ((counterBorderAnim.tick % P) + P) % P;
        const spinOffset = ((Math.floor(counterBorderAnim.spinAngle) % P) + P) % P;
        perim.forEach(([r, c], i) => {
            const key = `${r},${c}`;
            const ch  = cornerMap[key] ?? edgeChar(r, c);
            const arcLen = Math.floor(P / 4);
            const lit = (((i - t) % P + P) % P) < arcLen;
            setC(r, c, ch, lit ? bright : norm);
        });
        // Value
        const midR = r1 + 1;
        const text = String(val);
        const midC = Math.floor((c1 + c2) / 2);
        const start = midC - Math.floor(text.length / 2);
        text.split('').forEach((ch, i) => {
            const c = start + i;
            if (c > c1 && c < c2) { g[midR][c] = ch; col[midR][c] = norm; }
        });
    });

    KB_KEYS.forEach(({ label, row, c1, c2, key, norm, pressed: pressedCol, bg, pbg }) => {
        const on = isKeyPressed(key);
        const borderCol = on ? pressedCol : norm;
        const bgCol     = on ? pbg : bg;
        const textCol   = on ? pressedCol : norm;

        const gr = kbGridRow(row);
        const isEnter = row === 2;
        const r1 = gr, r2 = gr + 2;

        // Fill background
        for (let r = r1; r <= r2; r++)
            for (let c = c1; c <= c2; c++) { g[r][c] = ' '; col[r][c] = bgCol; }

        // Border
        const setB = (r, c, ch) => { if (r < ROWS && c < COLS) { g[r][c] = ch; col[r][c] = borderCol; } };
        setB(r1, c1, '┌'); setB(r1, c2, '┐');
        setB(r2, c1, '└'); setB(r2, c2, '┘');
        for (let c = c1 + 1; c < c2; c++) { setB(r1, c, '─'); setB(r2, c, '─'); }
        for (let r = r1 + 1; r < r2; r++) { setB(r, c1, '│'); setB(r, c2, '│'); }

        // Label centered
        const midC = Math.floor((c1 + c2) / 2);
        const midR = Math.floor((r1 + r2) / 2);
        const lStart = midC - Math.floor(label.length / 2) + (row === 1 ? 1 : 0);
        label.split('').forEach((ch, i) => {
            const c = lStart + i;
            if (c > c1 && c < c2) { g[midR][c] = ch; col[midR][c] = textCol; }
        });
    });
}

// Hit-test: given canvas pixel coords, return key or null
function hitTestKeyboard(canvas, px, py) {
    const cw = canvas.width, ch = canvas.height;
    const charW = cw / COLS, charH = ch / ROWS;
    const gridCol = Math.floor(px / charW);
    const gridRow = Math.floor(py / charH);
    if (gridRow < KB_TOP) return null;
    return KB_KEYS.find(({ row, c1, c2 }) => {
        const r1 = kbGridRow(row), r2 = r1 + 2;
        return gridRow >= r1 && gridRow <= r2 && gridCol >= c1 && gridCol <= c2;
    }) ?? null;
}

// Wire canvas click/touch for all three canvases
function wireCanvasKeyboard(canvas) {
    const fire = (px, py) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width  / rect.width;
        const scaleY = canvas.height / rect.height;
        const hit = hitTestKeyboard(canvas, (px - rect.left) * scaleX, (py - rect.top) * scaleY);
        if (!hit) return;
        flashKey(hit.key);
        if (hit.key === 'Enter') { submitCommand(); return; }
        document.dispatchEvent(new KeyboardEvent('keydown', { key: hit.key, bubbles: true }));
    };
    canvas.addEventListener('pointerdown', e => { e.preventDefault(); fire(e.clientX, e.clientY); });
}

// ─── BROADWAY LIGHTS ──────────────────────────────────────────────────────────
const LIGHTS      = { r1: 2, r2: 25, c1: 1, c2: 38 };
const RINGS  = [
    { rect: { r1: 11, r2: 17, c1: 10, c2: 29 }, on: '#33ff33', off: '#002a00' },
    { rect: { r1:  9, r2: 19, c1:  8, c2: 31 }, on: '#ff3333', off: '#2a0000' },
    { rect: { r1:  7, r2: 21, c1:  6, c2: 33 }, on: '#3399ff', off: '#00102a' },
    { rect: { r1:  5, r2: 23, c1:  4, c2: 35 }, on: '#ffee33', off: '#2a2500' },
];

function perimeterPositions({ r1, r2, c1, c2 }) {
    const pts = [];
    for (let c = c1; c <= c2; c++) pts.push([r1, c]);
    for (let r = r1 + 1; r <= r2; r++) pts.push([r, c2]);
    for (let c = c2 - 1; c >= c1; c--) pts.push([r2, c]);
    for (let r = r2 - 1; r > r1; r--) pts.push([r, c1]);
    return pts;
}

function paintRing(col, { r1, r2, c1, c2 }, color) {
    const set = (r, c) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS) col[r][c] = color; };
    for (let c = c1; c <= c2; c++) { set(r1, c); set(r2, c); }
    for (let r = r1; r <= r2; r++) { set(r, c1); set(r, c2); }
}

const lightsPerim    = perimeterPositions(LIGHTS);
const lightPositions = lightsPerim.filter((_, i) => i % 3 === 0);
const N_LIGHTS       = lightPositions.length;

function drawRect(g, { r1, r2, c1, c2 }, ch) {
    g[r1][c1] = ch.tl; g[r1][c2] = ch.tr;
    g[r2][c1] = ch.bl; g[r2][c2] = ch.br;
    for (let c = c1 + 1; c < c2; c++) { g[r1][c] = ch.h; g[r2][c] = ch.h; }
    for (let r = r1 + 1; r < r2; r++) { g[r][c1] = ch.v; g[r][c2] = ch.v; }
}

function buildBroadwayGrid(tick) {
    const g   = makeGrid();
    const col = Array.from({ length: ROWS }, () => Array(COLS).fill(null));

    // ── RINGS: independent animation on ringTick ──────────────────────────────
    // Pattern: 4 cycles of radial grow, then 1 spin rotation (32 frames), repeat.
    // Radial grow: each cycle = 8 ticks (4 rings × 2 ticks each: on then off)
    // 4 grow cycles = 32 ticks. 1 spin = 32 ticks. Total pattern = 64 ticks.
    const RING_CYCLE = 65;
    const rt = ringTick % RING_CYCLE;

    if (rt < 32) {
        // Radial grow phase: 4 cycles × 8 ticks each
        const growCycle = rt % 8; // 0–7 within each grow cycle
        // Each ring lights for 2 ticks, innermost first: ring0@0-1, ring1@2-3, ring2@4-5, ring3@6-7
        RINGS.forEach(({ rect, on, off }, i) => {
            const lit = growCycle >= i * 2 && growCycle < i * 2 + 2;
            paintRing(col, rect, lit ? on : off);
        });
    } else {
        // Spin phase: 32 frames = 1 full rotation, 1/8 arc
        const spinTick = rt - 32;
        RINGS.forEach(({ rect, on, off }) => {
            const pts = perimeterPositions(rect);
            const P = pts.length;
            // 2 rotations in 33 steps: step size = 2P/32, giving 33 evenly spaced frames
            // that land exactly back at start on frame 32 (the +1 closing frame)
            const offset = Math.floor(spinTick * 2 * P / 32) % P;
            const arcLen = Math.max(1, Math.floor(P / 3));
            pts.forEach(([r, c], i) => {
                const lit = (((i - offset) % P + P) % P) < arcLen;
                if (r >= 0 && r < ROWS && c >= 0 && c < COLS) col[r][c] = lit ? on : off;
            });
        });
    }

    // ── SUPER SELLER 8086 + rotating slides: independent animation on ssTick ──
    // Each slide: 16 scroll-in, 6 flash, 16 reveal line1 L→R, 6 reveal line2 L→R,
    //             6 final flash, 4 hold, 16 scroll-out, 4 blank = 74 ticks/slide
    const SLIDES = [
        {
            line1: { str: '* SUPER SELLER *', colors: [
                '#ffffff','#ff3333','#ff9933','#ffee33','#33ff33','#3399ff','#cc33ff','#ff33cc',
                '#ff3333','#ffee33','#33ff33','#3399ff','#ff9933','#cc33ff','#ff33cc','#ffffff',
            ]},
            line2: { str: '8086', colors: ['#ffee33','#ff9933','#ff3333','#ffee33'] },
        },
        {
            line1: { str: '* TEXTJAM *', colors: [
                '#ffffff','#3399ff','#3399ff','#88ccff','#3399ff','#3399ff','#88ccff','#3399ff',
                '#3399ff','#88ccff','#ffffff',
            ]},
            line2: { str: '2026', colors: ['#3399ff','#88ccff','#3399ff','#88ccff'] },
        },
        {
            line1: { str: '* BALLROLLER *', colors: [
                '#ffffff','#33ff33','#ff3333','#3399ff','#ffee33','#33ff33','#ff3333','#3399ff',
                '#ffee33','#33ff33','#ff3333','#3399ff','#ffee33','#ffffff',
            ]},
            line2: { str: 'GAMES', colors: ['#33ff33','#ff3333','#3399ff','#ffee33','#33ff33'] },
        },
    ];
    const TICKS_PER_SLIDE = 74;
    const SS_CYCLE = TICKS_PER_SLIDE * SLIDES.length;
    const phase = ssTick % SS_CYCLE;
    const slideIdx = Math.floor(phase / TICKS_PER_SLIDE);
    const sp = phase % TICKS_PER_SLIDE; // local phase within this slide
    const slide = SLIDES[slideIdx];

    const whiteOn = false;
    lightPositions.forEach(([r, c], i) => {
        const on = whiteOn || ((i - tick + N_LIGHTS) % N_LIGHTS) % 3 === 0;
        g[r][c]   = on ? '█' : '░';
        col[r][c] = on ? '#ffffff' : '#555555';
    });

    const INNER = { r1: 11, r2: 17, c1: 11, c2: 28 };
    const midR = Math.floor((INNER.r1 + INNER.r2) / 2);
    const clipC = (c) => c > INNER.c1 && c < INNER.c2;

    // Per-slide scroll/visibility using longest line for scroll width
    const line1 = slide.line1;
    const line2 = slide.line2;
    const refLen = line1.str.length; // scroll reference width

    // sp layout: 0-15 scroll-in, 16-21 flash, 22-37 reveal line1,
    //            38-43 reveal line2 (or hold if no line2), 44-49 final flash,
    //            50-53 hold, 54-69 scroll-out, 70-73 blank
    let scrollOffset = 0, visible = true;
    if (sp < 16) {
        scrollOffset = Math.round(sp * refLen / 16) - refLen;
    } else if (sp < 54) {
        scrollOffset = 0;
    } else if (sp < 70) {
        scrollOffset = sp - 53;
    } else {
        visible = false;
    }

    if (visible) {
        // ── Draw line 1 ──
        line1.str.split('').forEach((ch, i) => {
            const finalCol = Math.floor((COLS - line1.str.length) / 2);
            const c = finalCol + i + scrollOffset;
            if (!clipC(c)) return;
            g[midR - 2][c] = ch;
            let lit;
            if (sp < 16)       { lit = true; }
            else if (sp < 22)  { lit = (sp % 2) === 0; }
            else if (sp < 38)  { lit = i <= (sp - 22); }
            else if (sp < 44)  { lit = true; }
            else if (sp < 50)  { lit = (sp % 2) === 0; }
            else               { lit = true; }
            // asterisks (index 0 and last) always white
            const isAsterisk = (i === 0 || i === line1.str.length - 1);
            col[midR - 2][c] = lit ? (isAsterisk ? '#ffffff' : (line1.colors[i] ?? '#ffffff')) : '#1a1f3a';
        });

        // ── Draw line 2 (if present) ──
        if (line2.str) {
            line2.str.split('').forEach((ch, i) => {
                const finalCol = Math.floor((COLS - line2.str.length) / 2);
                const c = finalCol + i + scrollOffset;
                if (!clipC(c)) return;
                g[midR][c] = ch;
                let lit;
                if (sp < 16)       { lit = true; }
                else if (sp < 22)  { lit = (sp % 2) === 0; }
                else if (sp < 38)  { lit = false; }
                else if (sp < 44)  { lit = i <= (sp - 38); }
                else if (sp < 50)  { lit = (sp % 2) === 0; }
                else               { lit = true; }
                col[midR][c] = lit ? (line2.colors[i] ?? '#ffffff') : '#1a1f3a';
            });
        }
    }
    // Row 29 is outside the lights border — plain white, no color entry needed
    writeCenter(g, 27, 'PRESS ENTER TO CONTINUE');

    RINGS.forEach(({ rect }) =>
        drawRect(g, rect, { h: '─', v: '│', tl: '┌', tr: '┐', bl: '└', br: '┘' })
    );

    // White border: Broadway-style bulbs — every 2nd perimeter cell is a bulb
    {
        const { r1, r2, c1, c2 } = LIGHTS;
        const perim = [];
        for (let c = c1; c <= c2; c++) perim.push([r1, c]);
        for (let r = r1 + 1; r <= r2; r++) perim.push([r, c2]);
        for (let c = c2 - 1; c >= c1; c--) perim.push([r2, c]);
        for (let r = r2 - 1; r > r1; r--) perim.push([r, c1]);

        perim.forEach(([r, c], i) => {
            const on = ((i - tick + perim.length) % perim.length) % 4 === 0;
            g[r][c]   = on ? '●' : '○';
            col[r][c] = on ? '#ffffff' : '#444444';
        });
    }

    // Static white trim — one frame inside the bulb ring (smaller), one outside (larger)
    {
        const trimFrames = [
            { r1: 3, r2: 24, c1: 2, c2: 37 },  // smaller: inside the flashing lights
            { r1: 1, r2: 26, c1: 0, c2: 39 },  // larger: outside the flashing lights
        ];
        trimFrames.forEach(({ r1, r2, c1, c2 }) => {
            const setTrim = (r, c, ch) => {
                if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
                g[r][c]   = ch;
                col[r][c] = '#cccccc';
            };
            setTrim(r1, c1, '╔'); setTrim(r1, c2, '╗');
            setTrim(r2, c1, '╚'); setTrim(r2, c2, '╝');
            for (let c = c1 + 1; c < c2; c++) { setTrim(r1, c, '═'); setTrim(r2, c, '═'); }
            for (let r = r1 + 1; r < r2; r++) { setTrim(r, c1, '║'); setTrim(r, c2, '║'); }
        });
    }

    drawKeyboard(g, col);
    return { g, col };
}

// ─── STATIC INTRO SCREENS ─────────────────────────────────────────────────────
function buildScreen2() {
    const g = makeGrid();
    const col = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    writeCenter(g, 2,  'WELCOME TO');
    writeCenter(g, 4,  'STOCK TRADING');
    writeCenter(g, 7,  '! WARNING !');
    writeCenter(g, 9,  '30 SECONDS PER ROUND');
    writeCenter(g, 11, 'Unsold stocks EXPIRE');
    writeCenter(g, 12, 'and become WORTHLESS');
    writeCenter(g, 14, 'Buy & sell quickly to');
    writeCenter(g, 15, 'maximize your profits!');
    writeCenter(g, 27, 'PRESS ENTER TO CONTINUE');
    drawKeyboard(g, col);
    return g;
}

function buildScreen3() {
    const g = makeGrid();
    const col = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    writeCenter(g, 3,  'HOW TO PLAY');
    writeCenter(g, 6,  'Q  =  BUY');
    writeCenter(g, 8,  'A  =  SELL');
    writeCenter(g, 11, 'Watch the price chart');
    writeCenter(g, 12, 'and trade wisely.');
    writeCenter(g, 15, 'Type a quantity then');
    writeCenter(g, 16, 'press ENTER to confirm.');
    writeCenter(g, 27, 'PRESS ENTER TO CONTINUE');
    drawKeyboard(g, col);
    return g;
}

// ─── SCROLL ANIMATION ─────────────────────────────────────────────────────────
function animateScrollDown(fromGrid, toGrid, renderer, tickMs = 40) {
    const current = fromGrid.map(r => [...r]);
    return new Promise(resolve => {
        let tick = 0;
        const interval = setInterval(() => {
            for (let c = 0; c < COLS; c++) {
                for (let r = ROWS - 1; r > 0; r--) current[r][c] = current[r - 1][c];
                current[0][c] = toGrid[ROWS - 1 - tick][c];
            }
            renderer.render(current);
            tick++;
            if (tick >= ROWS) { clearInterval(interval); resolve(); }
        }, tickMs);
    });
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let currentScreen   = 0;
let waitingForEnter = false;
let gameActive      = false;
let lastIntroGrid   = makeGrid();
let broadwayInterval = null;
let broadwayTick    = 0;
let ssTick          = 0;   // drives SUPER SELLER 8086 animation independently
let ringTick        = 0;   // drives RINGS animation independently

const stock  = { price: 45, volatility: 0.15, history: [45] };
const player = { cash: 1000, shares: 0, startingCash: 1000, green: 0, red: 0, blue: 0, yellow: 0 };
let roundTime = 30, roundInterval = null, currentMode = null;

// ─── COUNTER BORDER ANIMATION ─────────────────────────────────────────────────
// Arc: quarter of the perimeter lit, rotating continuously.
const counterBorderAnim = { tick: 0 };
setInterval(() => {
    counterBorderAnim.tick++;
    if (typeof gameActive !== 'undefined' && gameActive) updateGameDisplay();
}, 80);

// ─── INTRO FLOW ───────────────────────────────────────────────────────────────
async function showIntroScreen() {
    if (currentScreen === 0) {
        const { g: firstG } = buildBroadwayGrid(0);
        await animateScrollDown(lastIntroGrid, firstG, introRenderer);
        lastIntroGrid = firstG;
        broadwayTick  = 0;
        ssTick        = 0;
        ringTick      = 0;
        broadwayInterval = setInterval(() => {
            broadwayTick++; ssTick++; ringTick++;
            const { g, col } = buildBroadwayGrid(broadwayTick);
            introRenderer.render(g, col);
        }, 120);
        waitingForEnter = true;
        currentScreen++;

    } else if (currentScreen === 1) {
        clearInterval(broadwayInterval);
        const { g: fromG } = buildBroadwayGrid(broadwayTick);
        const nextGrid = buildScreen2();
        await animateScrollDown(fromG, nextGrid, introRenderer);
        lastIntroGrid = nextGrid;
        waitingForEnter = true;
        currentScreen++;

    } else if (currentScreen === 2) {
        const nextGrid = buildScreen3();
        await animateScrollDown(lastIntroGrid, nextGrid, introRenderer);
        lastIntroGrid = nextGrid;
        waitingForEnter = true;
        currentScreen++;

    } else {
        startGameplay();
    }
}

function startGameplay() {
    document.getElementById('introScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    gameActive = true;
    startRound();
}

// ─── GAME GRID BUILDER ────────────────────────────────────────────────────────
function buildGameGrid() {
    const g = makeGrid();
    const col = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    writeStr(g, 0, 0,  `RED $${stock.price.toFixed(2)}`);
    writeStr(g, 0, 30, `${roundTime}s`);
    fillRow(g, 1, '─');

    const chartTop = 3, chartH = 10;
    const hist = stock.history.slice(-(COLS - 2));
    const maxP = Math.max(...hist), minP = Math.min(...hist), range = maxP - minP || 1;
    for (let c = 0; c < hist.length; c++) {
        const bar = Math.round(((hist[c] - minP) / range) * (chartH - 1));
        for (let r = 0; r < chartH; r++)
            g[chartTop + chartH - 1 - r][c + 1] = r <= bar ? '·' : ' ';
    }

    fillRow(g, 16, '─');
    if (currentMode) writeStr(g, 18, 0, currentMode === 'buy' ? 'BUY MODE' : 'SELL MODE');
    writeStr(g, 20, 0, `Cash: $${player.cash.toFixed(2)}`);
    writeStr(g, 21, 0, `Shares: ${player.shares}`);
    writeStr(g, 22, 0, `Value: $${(player.shares * stock.price).toFixed(2)}`);
    drawKeyboard(g, col);
    return { g, col };
}

const updateGameDisplay = () => {
    const { g, col } = buildGameGrid();
    gameRenderer.render(g, col, true);
};

// ─── STOCK / ROUND LOGIC ──────────────────────────────────────────────────────
function updateStockPrice() {
    stock.price = parseFloat(
        Math.max(1, stock.price * (1 + (Math.random() - 0.5) * stock.volatility)).toFixed(2)
    );
    stock.history.push(stock.price);
    updateGameDisplay();
}

function startRound() {
    roundTime = 30; stock.history = [stock.price]; currentMode = null;
    updateGameDisplay();
    if (roundInterval) clearInterval(roundInterval);
    roundInterval = setInterval(() => {
        roundTime--; updateGameDisplay();
        if (roundTime <= 0) endRound();
    }, 1000);
}

async function endRound() {
    clearInterval(roundInterval);
    gameActive = false;

    const portfolio = player.shares * stock.price;
    const total     = player.cash + portfolio;
    const profit    = total - player.startingCash;

    const resultsLines = [
        'ROUND OVER', '', `Final: $${stock.price.toFixed(2)}`,
        `Unsold: ${player.shares}`, '',
        `Cash: $${player.cash.toFixed(2)}`,
        `Portfolio: $${portfolio.toFixed(2)}`,
        `Total: $${total.toFixed(2)}`, '',
        `Profit: $${profit.toFixed(2)}`,
        `(${((profit / player.startingCash) * 100).toFixed(1)}%)`
    ];

    document.getElementById('resultsScreen').classList.remove('hidden');
    const { g: gameG } = buildGameGrid();
    await animateScrollDown(gameG, parseGrid(resultsLines), resultsRenderer);
}

function handleResultsEnter() {
    document.getElementById('resultsScreen').classList.add('hidden');
    Object.assign(player, { cash: 1000, shares: 0, startingCash: 1000, green: 0, red: 0, blue: 0, yellow: 0 });
    Object.assign(stock,  { price: 45, history: [45], volatility: 0.15 });
    gameActive = true;
    startRound();
}

// ─── TRADING ──────────────────────────────────────────────────────────────────
const KEY_COLOR = { q: 'green', w: 'red', e: 'blue', r: 'yellow', a: 'green', s: 'red', d: 'blue', f: 'yellow' };

function buyStock(qty) {
    if (!qty || qty <= 0 || stock.price * qty > player.cash) return false;
    player.cash -= stock.price * qty; player.shares += qty;
    const color = KEY_COLOR[activeKey];
    if (color) player[color] += qty;
    return true;
}
function sellStock(qty) {
    if (!qty || qty <= 0 || player.shares < qty) return false;
    player.cash += stock.price * qty; player.shares -= qty;
    const color = KEY_COLOR[activeKey];
    if (color) player[color] = Math.max(0, player[color] - qty);
    return true;
}

function submitCommand() {
    if (waitingForEnter) { waitingForEnter = false; showIntroScreen(); return; }
    if (!gameActive || !currentMode) return;
    openQtyModal(currentMode);
}
function openQtyModal(mode) {
    document.getElementById('qtyLabel').textContent = `QUANTITY TO ${mode.toUpperCase()}:`;
    const m = document.getElementById('qtyModal'); m.style.display = 'flex';
    setTimeout(() => document.getElementById('qtyInput').focus(), 50);
}
function closeQtyModal() { document.getElementById('qtyModal').style.display = 'none'; }
function confirmQty() {
    const qty = parseInt(document.getElementById('qtyInput').value, 10);
    closeQtyModal();
    if (!isNaN(qty) && qty > 0 && (currentMode === 'buy' ? buyStock : sellStock)(qty))
        { currentMode = null; activeKey = null; updateGameDisplay(); }
}
document.getElementById('qtyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); confirmQty(); }
    if (e.key === 'Escape') { closeQtyModal(); }
});

// ─── INPUT ────────────────────────────────────────────────────────────────────
let activeKey = null;

function flashKeyButton(key) {
    flashKey(key.toLowerCase());
    flashKey(key); // covers 'Enter' etc
}

document.addEventListener('keydown', e => {
    flashKeyButton(e.key);
    if (e.key === 'Enter') { e.preventDefault(); submitCommand(); return; }

    const buyKeys  = { q: 'q', Q: 'q', w: 'w', W: 'w', e: 'e', E: 'e', r: 'r', R: 'r' };
    const sellKeys = { a: 'a', A: 'a', s: 's', S: 's', d: 'd', D: 'd', f: 'f', F: 'f' };

    if (buyKeys[e.key] !== undefined) {
        e.preventDefault();
        activeKey = buyKeys[e.key];
        if (waitingForEnter) {
            const color = KEY_COLOR[activeKey];
            if (color) player[color] += 1;
            const { g, col } = buildBroadwayGrid(broadwayTick);
            introRenderer.render(g, col);
        } else if (gameActive) {
            currentMode = currentMode === 'buy' ? null : 'buy'; updateGameDisplay();
        }
    } else if (sellKeys[e.key] !== undefined) {
        e.preventDefault();
        activeKey = sellKeys[e.key];
        if (waitingForEnter) {
            const color = KEY_COLOR[activeKey];
            if (color) player[color] = Math.max(0, player[color] - 1);
            const { g, col } = buildBroadwayGrid(broadwayTick);
            introRenderer.render(g, col);
        } else if (gameActive) {
            currentMode = currentMode === 'sell' ? null : 'sell'; updateGameDisplay();
        }
    }
});

// ─── ON-SCREEN KEYBOARD ───────────────────────────────────────────────────────
wireCanvasKeyboard(document.getElementById('introCanvas'));
wireCanvasKeyboard(document.getElementById('resultsCanvas'));
wireCanvasKeyboard(document.getElementById('gameCanvas'));

// ─── CUSTOM CURSOR ────────────────────────────────────────────────────────────
const cursorEl = document.getElementById('cursor');
const cursorSvg = document.getElementById('cursorSvg');
function setCursorVariant(onButton) {
    cursorEl.style.width = '24px'; cursorEl.style.height = '24px';
    cursorEl.style.transform = 'translate(-12px,-12px)';
    cursorSvg.setAttribute('width','24'); cursorSvg.setAttribute('height','24');
    cursorSvg.setAttribute('viewBox','0 0 24 24');
    const glow = id => `<defs><filter id='${id}' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='1.2' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>`;
    if (onButton) {
        cursorSvg.innerHTML = glow('gc') + `<g filter='url(#gc)'><line x1='12' y1='0' x2='12' y2='8' stroke='#00ff88' stroke-width='1.5' stroke-linecap='round'/><line x1='12' y1='16' x2='12' y2='24' stroke='#00ff88' stroke-width='1.5' stroke-linecap='round'/><line x1='0' y1='12' x2='8' y2='12' stroke='#00ff88' stroke-width='1.5' stroke-linecap='round'/><line x1='16' y1='12' x2='24' y2='12' stroke='#00ff88' stroke-width='1.5' stroke-linecap='round'/><rect x='10' y='10' width='4' height='4' fill='#00ff88'/><polyline points='9,4 9,9 4,9' fill='none' stroke='#00ff88' stroke-width='1' opacity='0.6'/><polyline points='15,4 15,9 20,9' fill='none' stroke='#00ff88' stroke-width='1' opacity='0.6'/><polyline points='9,20 9,15 4,15' fill='none' stroke='#00ff88' stroke-width='1' opacity='0.6'/><polyline points='15,20 15,15 20,15' fill='none' stroke='#00ff88' stroke-width='1' opacity='0.6'/></g>`;
    } else {
        cursorSvg.innerHTML = glow('gn') + `<g filter='url(#gn)'><polyline points='9,4 9,9 4,9' fill='none' stroke='#00ff88' stroke-width='1' opacity='0.6'/><polyline points='15,4 15,9 20,9' fill='none' stroke='#00ff88' stroke-width='1' opacity='0.6'/><polyline points='9,20 9,15 4,15' fill='none' stroke='#00ff88' stroke-width='1' opacity='0.6'/><polyline points='15,20 15,15 20,15' fill='none' stroke='#00ff88' stroke-width='1' opacity='0.6'/></g>`;
    }
}
setCursorVariant(false);
function isOverButton(e) {
    const t = e.target;
    if (t.tagName === 'BUTTON') return true;
    if (t.tagName === 'CANVAS') { const r = t.getBoundingClientRect(); return !!hitTestKeyboard(t, (e.clientX-r.left)*t.width/r.width, (e.clientY-r.top)*t.height/r.height); }
    return false;
}
document.addEventListener('mousemove', e => {
    cursorEl.style.left = e.clientX + 'px'; cursorEl.style.top = e.clientY + 'px';
    setCursorVariant(isOverButton(e));
});
document.addEventListener('mouseleave', () => { cursorEl.style.opacity = '0'; });
document.addEventListener('mouseenter', () => { cursorEl.style.opacity = '1'; });

requestAnimationFrame(() => requestAnimationFrame(() => showIntroScreen()));
</script>
