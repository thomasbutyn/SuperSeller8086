<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperSeller8086 - Stock Trading Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #0a0e27;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0e27;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow: hidden;
            padding: 0;
        }

        .fullscreen-overlay.hidden {
            display: none;
        }

        .scroll-text {
            font-size: 14px;
            text-align: center;
            white-space: pre;
            text-shadow: 0 0 10px #00ff41;
            letter-spacing: 0px;
            line-height: 1.2;
            max-width: 95vw;
            padding: 20px;
            overflow: hidden;
            transform: translateY(-150vh);
        }

        .scroll-text.active {
            animation: scrollDown 6s ease-in-out forwards;
        }

        @keyframes scrollDown {
            0% {
                transform: translateY(-150vh);
            }
            10% {
                transform: translateY(0);
            }
            80% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(150vh);
            }
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background-color: #1a1f3a;
            border: 2px solid #00ff41;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 600px;
            margin: 0 10px;
        }

        .game-header {
            background-color: #0a0e27;
            border-bottom: 2px solid #00ff41;
            padding: 10px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff41;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer {
            font-size: 14px;
            color: #00ff41;
        }

        .stock-market {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            border-bottom: 2px solid #00ff41;
            white-space: pre;
            word-wrap: break-word;
            font-size: 11px;
            line-height: 1.2;
            font-family: 'Courier New', monospace;
        }

        .stock-market::-webkit-scrollbar {
            width: 8px;
        }

        .stock-market::-webkit-scrollbar-track {
            background: #0a0e27;
        }

        .stock-market::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 4px;
        }

        .game-input-area {
            display: flex;
            gap: 5px;
            padding: 15px;
            background-color: #0a0e27;
            flex-direction: column;
        }

        .command-row {
            display: flex;
            gap: 5px;
        }

        .game-input {
            flex: 1;
            background-color: #1a1f3a;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            outline: none;
        }

        .game-input:focus {
            box-shadow: 0 0 5px #00ff41;
        }

        button {
            background-color: #00ff41;
            color: #0a0e27;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            border-radius: 3px;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #00cc33;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        button:active {
            transform: scale(0.95);
        }

        .command-info {
            font-size: 12px;
            color: #00ff41;
            margin-top: 10px;
            text-align: center;
        }

        .player-stats {
            background-color: #0a0e27;
            border-top: 1px solid #00ff41;
            padding: 10px 15px;
            font-size: 11px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="fullscreen-overlay" id="overlay">
        <div class="scroll-text" id="scrollText"></div>
    </div>

    <div class="game-container">
        <div class="game-header">
            <span>> RED <span id="redPrice">$45.00</span> <</span>
            <span class="timer">Time: <span id="roundTimer">30</span>s</span>
        </div>
        <div class="stock-market" id="stockMarket"></div>
        <div class="player-stats" id="playerStats">Cash: $1000 | Shares: 0 | Value: $0</div>
        <div class="game-input-area">
            <div class="command-row">
                <input 
                    type="text" 
                    class="game-input" 
                    id="commandInput" 
                    placeholder="Enter quantity or command..."
                    autocomplete="off"
                >
                <button onclick="submitCommand()">SUBMIT</button>
            </div>
            <div class="command-info">
                Q: Buy | A: Sell
            </div>
        </div>
    </div>

    <script>
        const introScreens = [
            `> SUPERSELLER8086 <

███████████████████████
███████████████████████
███████████████████████
███████████████████████`,
            
            `WELCOME TO STOCK TRADING
        
WARNING: Each round lasts 30 seconds!

Any unsold stocks at the end of 
each round will EXPIRE and become
WORTHLESS ($0 value).

You must buy and sell quickly to
maximize profits before expiration!`,

            `Buy (q)
Sell (a)`
        ];

        let currentScreen = 0;

        function showNextScreen() {
            if (currentScreen < introScreens.length) {
                const scrollText = document.getElementById('scrollText');
                scrollText.textContent = introScreens[currentScreen];
                scrollText.classList.remove('active');
                
                // Force reflow to restart animation
                void scrollText.offsetWidth;
                
                scrollText.classList.add('active');
                currentScreen++;
                setTimeout(showNextScreen, 6100);
            } else {
                document.getElementById('overlay').classList.add('hidden');
                initializeGame();
                startRound();
            }
        }

        // Stock data
        const stock = {
            price: 45,
            volatility: 0.15,
            history: [45]
        };

        let player = {
            cash: 1000,
            shares: 0,
            trades: []
        };

        let roundTime = 30;
        let roundInterval = null;
        let currentMode = null; // 'buy' or 'sell'

        function updateStockPrice() {
            const changePercent = (Math.random() - 0.5) * stock.volatility;
            const newPrice = Math.max(1, stock.price * (1 + changePercent));
            stock.price = parseFloat(newPrice.toFixed(2));
            stock.history.push(stock.price);
            
            document.getElementById('redPrice').textContent = `$${stock.price.toFixed(2)}`;
            updateMarketDisplay();
        }

        function displayStockChart(height = 12) {
            const history = stock.history.slice(-40);
            const maxPrice = Math.max(...history);
            const minPrice = Math.min(...history);
            const range = maxPrice - minPrice || 1;

            let chart = '';
            for (let i = 0; i < height; i++) {
                let line = '';
                for (let j = 0; j < history.length; j++) {
                    const normalized = (history[j] - minPrice) / range;
                    const barHeight = Math.round(normalized * (height - 1));
                    
                    if (barHeight >= (height - 1 - i)) {
                        line += '·';
                    } else {
                        line += ' ';
                    }
                }
                chart += line + '\n';
            }
            return chart;
        }

        function updateMarketDisplay() {
            let display = displayStockChart(12);
            document.getElementById('stockMarket').textContent = display;
            document.getElementById('stockMarket').scrollTop = document.getElementById('stockMarket').scrollHeight;
        }

        function updatePlayerStats() {
            const portfolioValue = player.shares * stock.price;
            document.getElementById('playerStats').textContent = 
                `Cash: $${player.cash.toFixed(2)} | Shares: ${player.shares} | Value: $${portfolioValue.toFixed(2)}`;
        }

        function startRound() {
            roundTime = 30;
            updateMarketDisplay();
            updatePlayerStats();

            if (roundInterval) clearInterval(roundInterval);

            roundInterval = setInterval(() => {
                roundTime--;
                document.getElementById('roundTimer').textContent = roundTime;
                updateStockPrice();

                if (roundTime <= 0) {
                    endRound();
                }
            }, 1000);
        }

        function endRound() {
            clearInterval(roundInterval);
            currentMode = null;
            
            let message = '⚠️  END OF ROUND ⚠️\n\nAll unsold stocks EXPIRED!\n';
            
            if (player.shares > 0) {
                message += `Lost ${player.shares} RED shares\n`;
                player.shares = 0;
            }

            alert(message + '\nStarting new round...');
            startRound();
        }

        function buyStock(quantity) {
            if (!quantity || quantity <= 0) return 'Invalid quantity!';

            const cost = stock.price * quantity;
            if (cost > player.cash) {
                return `Insufficient funds! Need $${cost.toFixed(2)}, have $${player.cash.toFixed(2)}`;
            }

            player.cash -= cost;
            player.shares += quantity;
            updatePlayerStats();
            currentMode = null;
            document.getElementById('commandInput').value = '';
            return `✓ Bought ${quantity} RED @ $${stock.price.toFixed(2)}`;
        }

        function sellStock(quantity) {
            if (!quantity || quantity <= 0) return 'Invalid quantity!';
            if (player.shares < quantity) {
                return `Only have ${player.shares} shares!`;
            }

            const proceeds = stock.price * quantity;
            player.cash += proceeds;
            player.shares -= quantity;
            updatePlayerStats();
            currentMode = null;
            document.getElementById('commandInput').value = '';
            return `✓ Sold ${quantity} RED for $${proceeds.toFixed(2)}`;
        }

        function submitCommand() {
            const input = document.getElementById('commandInput');
            const command = input.value.trim();

            if (!command) return;

            let output = '';
            
            if (currentMode === 'buy') {
                const quantity = parseInt(command);
                output = buyStock(quantity);
            } else if (currentMode === 'sell') {
                const quantity = parseInt(command);
                output = sellStock(quantity);
            } else {
                output = 'Unknown command.';
            }

            if (output) {
                const stockMarket = document.getElementById('stockMarket');
                stockMarket.textContent += '\n$ ' + command + '\n' + output + '\n';
                stockMarket.scrollTop = stockMarket.scrollHeight;
            }

            input.value = '';
            input.focus();
        }

        // Handle Q and A key presses
        document.addEventListener('keydown', function(e) {
            if (e.key === 'q' || e.key === 'Q') {
                e.preventDefault();
                currentMode = 'buy';
                document.getElementById('commandInput').focus();
                document.getElementById('commandInput').value = '';
            } else if (e.key === 'a' || e.key === 'A') {
                e.preventDefault();
                currentMode = 'sell';
                document.getElementById('commandInput').focus();
                document.getElementById('commandInput').value = '';
            }
        });

        document.getElementById('commandInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitCommand();
            }
        });

        function initializeGame() {
            updateMarketDisplay();
            updatePlayerStats();
            document.getElementById('commandInput').focus();
        }

        // Start intro sequence
        showNextScreen();
    </script>
</body>
</html>
