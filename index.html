<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperSeller8086 - Text Adventure Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0e27;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0e27;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow: hidden;
        }

        .scroll-text {
            font-size: 18px;
            text-align: center;
            white-space: pre;
            text-shadow: 0 0 10px #00ff41;
            letter-spacing: 1px;
            line-height: 1.4;
            animation: scrollDown 6s ease-in forwards;
            max-width: 90%;
        }

        @keyframes scrollDown {
            0% {
                transform: translateY(-100vh);
            }
            15% {
                transform: translateY(0);
            }
            85% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(100vh);
            }
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background-color: #1a1f3a;
            border: 2px solid #00ff41;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 600px;
            opacity: 0;
            animation: fadeIn 0.5s ease-in 18s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .game-header {
            background-color: #0a0e27;
            border-bottom: 2px solid #00ff41;
            padding: 10px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff41;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer {
            font-size: 14px;
            color: #00ff41;
        }

        .stock-market {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            border-bottom: 2px solid #00ff41;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 12px;
            line-height: 1.4;
            font-family: 'Courier New', monospace;
        }

        .stock-market::-webkit-scrollbar {
            width: 8px;
        }

        .stock-market::-webkit-scrollbar-track {
            background: #0a0e27;
        }

        .stock-market::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 4px;
        }

        .game-input-area {
            display: flex;
            gap: 5px;
            padding: 15px;
            background-color: #0a0e27;
            flex-direction: column;
        }

        .command-row {
            display: flex;
            gap: 5px;
        }

        .game-input {
            flex: 1;
            background-color: #1a1f3a;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            outline: none;
        }

        .game-input:focus {
            box-shadow: 0 0 5px #00ff41;
        }

        button {
            background-color: #00ff41;
            color: #0a0e27;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            border-radius: 3px;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #00cc33;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        button:active {
            transform: scale(0.95);
        }

        .command-info {
            font-size: 12px;
            color: #00ff41;
            margin-top: 10px;
            text-align: center;
        }

        .player-stats {
            background-color: #0a0e27;
            border-top: 1px solid #00ff41;
            padding: 10px 15px;
            font-size: 12px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="fullscreen-overlay" id="overlay">
        <div class="scroll-text" id="scrollText"></div>
    </div>

    <div class="game-container">
        <div class="game-header">
            <span>> STOCK MARKET <</span>
            <span class="timer">Time: <span id="roundTimer">30</span>s</span>
        </div>
        <div class="stock-market" id="stockMarket"></div>
        <div class="player-stats" id="playerStats">Cash: $1000 | Shares: 0 | Portfolio: $0</div>
        <div class="game-input-area">
            <div class="command-row">
                <input 
                    type="text" 
                    class="game-input" 
                    id="commandInput" 
                    placeholder="Enter command (Q=buy, A=sell, or type: BUY STOCK_NAME QUANTITY)..."
                    autocomplete="off"
                >
                <button onclick="submitCommand()">SUBMIT</button>
            </div>
            <div class="command-info">
                Q: Buy Stock | A: Sell Stock | HELP: Show commands
            </div>
        </div>
    </div>

    <script>
        const introScreens = [
            `> SUPERSELLER8086 <
            
████████████████████████████████
████████████████████████████████
████████████████████████████████
████████████████████████████████`,
            
            `  WELCOME TO STOCK TRADING
        
WARNING: Each round lasts 30 seconds!

Any unsold stocks at the end of 
each round will EXPIRE and become
WORTHLESS ($0 value).

You must buy and sell quickly to
maximize profits before expiration!

Ready? Press ENTER to continue...`,

            `    ENTERING STOCK MARKET
        
████████████████████████████████
████████████████████████████████
████████████████████████████████
████████████████████████████████`
        ];

        let currentScreen = 0;
        let gameStarted = false;

        function showNextScreen() {
            if (currentScreen < introScreens.length) {
                document.getElementById('scrollText').textContent = introScreens[currentScreen];
                currentScreen++;
                setTimeout(showNextScreen, 6000);
            } else {
                document.getElementById('overlay').style.display = 'none';
                initializeGame();
                gameStarted = true;
                startRound();
            }
        }

        // Stocks data
        const stocks = {
            TECH: { price: 45, volatility: 0.15, history: [45] },
            GOLD: { price: 32, volatility: 0.08, history: [32] },
            CRYPTO: { price: 120, volatility: 0.25, history: [120] },
            OIL: { price: 55, volatility: 0.12, history: [55] }
        };

        let player = {
            cash: 1000,
            portfolio: {
                TECH: 0,
                GOLD: 0,
                CRYPTO: 0,
                OIL: 0
            },
            trades: []
        };

        let roundTime = 30;
        let roundInterval = null;

        function updateStockPrices() {
            Object.keys(stocks).forEach(stock => {
                const changePercent = (Math.random() - 0.5) * stocks[stock].volatility;
                const newPrice = Math.max(1, stocks[stock].price * (1 + changePercent));
                stocks[stock].price = parseFloat(newPrice.toFixed(2));
                stocks[stock].history.push(stocks[stock].price);
            });
            updateMarketDisplay();
        }

        function displayStockChart(stockName, height = 5) {
            const history = stocks[stockName].history.slice(-10);
            const maxPrice = Math.max(...history);
            const minPrice = Math.min(...history);
            const range = maxPrice - minPrice || 1;

            let chart = '';
            for (let i = 0; i < height; i++) {
                let line = '';
                for (let j = 0; j < history.length; j++) {
                    const normalized = (history[j] - minPrice) / range;
                    const barHeight = Math.round(normalized * (height - 1));
                    line += barHeight >= (height - 1 - i) ? '█' : ' ';
                }
                chart += line + '\n';
            }
            return chart;
        }

        function updateMarketDisplay() {
            let display = '┌─ STOCK PRICES ─────────────────┐\n';
            Object.keys(stocks).forEach(stock => {
                const price = stocks[stock].price;
                display += `${stock.padEnd(7)} $${price.toFixed(2).padStart(7)} `;
                display += `(Holdings: ${player.portfolio[stock]})\n`;
            });
            display += '└─────────────────────────────────┘\n\n';

            display += 'PRICE CHARTS (Last 10 updates):\n\n';
            Object.keys(stocks).forEach(stock => {
                display += `${stock}:\n${displayStockChart(stock, 4)}\n`;
            });

            document.getElementById('stockMarket').textContent = display;
        }

        function updatePlayerStats() {
            let portfolioValue = 0;
            Object.keys(player.portfolio).forEach(stock => {
                portfolioValue += player.portfolio[stock] * stocks[stock].price;
            });

            let totalShares = Object.values(player.portfolio).reduce((a, b) => a + b, 0);
            document.getElementById('playerStats').textContent = 
                `Cash: $${player.cash.toFixed(2)} | Total Shares: ${totalShares} | Portfolio Value: $${portfolioValue.toFixed(2)}`;
        }

        function startRound() {
            roundTime = 30;
            updateMarketDisplay();
            updatePlayerStats();

            roundInterval = setInterval(() => {
                roundTime--;
                document.getElementById('roundTimer').textContent = roundTime;
                updateStockPrices();

                if (roundTime <= 0) {
                    endRound();
                }
            }, 1000);
        }

        function endRound() {
            clearInterval(roundInterval);
            
            // Expire all stocks
            let message = '\n⚠️  END OF ROUND ⚠️\n';
            message += 'All unsold stocks have EXPIRED!\n';
            
            Object.keys(player.portfolio).forEach(stock => {
                if (player.portfolio[stock] > 0) {
                    message += `Lost ${player.portfolio[stock]} ${stock} shares (value: $0)\n`;
                    player.portfolio[stock] = 0;
                }
            });

            alert(message + '\nStarting new round...');
            startRound();
        }

        function processCommand(input) {
            const command = input.toUpperCase().trim();

            if (command === 'Q') {
                return buyMenu();
            } else if (command === 'A') {
                return sellMenu();
            } else if (command === 'HELP') {
                return `COMMANDS:
Q - Open buy menu
A - Open sell menu
BUY STOCK_NAME QUANTITY - Buy stocks
SELL STOCK_NAME QUANTITY - Sell stocks
Example: BUY TECH 5`;
            } else if (command.startsWith('BUY ')) {
                const parts = command.slice(4).split(' ');
                const stock = parts[0];
                const quantity = parseInt(parts[1]);
                return buyStock(stock, quantity);
            } else if (command.startsWith('SELL ')) {
                const parts = command.slice(5).split(' ');
                const stock = parts[0];
                const quantity = parseInt(parts[1]);
                return sellStock(stock, quantity);
            }
            return 'Unknown command. Type HELP for options.';
        }

        function buyMenu() {
            let menu = 'AVAILABLE STOCKS TO BUY:\n';
            Object.keys(stocks).forEach(stock => {
                menu += `${stock}: $${stocks[stock].price.toFixed(2)}\n`;
            });
            menu += '\nUse: BUY STOCK_NAME QUANTITY\nExample: BUY TECH 5';
            return menu;
        }

        function sellMenu() {
            let menu = 'YOUR HOLDINGS:\n';
            let hasStocks = false;
            Object.keys(player.portfolio).forEach(stock => {
                if (player.portfolio[stock] > 0) {
                    menu += `${stock}: ${player.portfolio[stock]} shares @ $${stocks[stock].price.toFixed(2)} each\n`;
                    hasStocks = true;
                }
            });
            if (!hasStocks) {
                menu = 'You have no stocks to sell!';
            } else {
                menu += '\nUse: SELL STOCK_NAME QUANTITY\nExample: SELL TECH 5';
            }
            return menu;
        }

        function buyStock(stock, quantity) {
            if (!stocks[stock]) return `Stock ${stock} not found!`;
            if (!quantity || quantity <= 0) return 'Invalid quantity!';

            const cost = stocks[stock].price * quantity;
            if (cost > player.cash) {
                return `Insufficient funds! Need $${cost.toFixed(2)}, have $${player.cash.toFixed(2)}`;
            }

            player.cash -= cost;
            player.portfolio[stock] += quantity;
            updatePlayerStats();
            return `✓ Bought ${quantity} ${stock} @ $${stocks[stock].price.toFixed(2)} each`;
        }

        function sellStock(stock, quantity) {
            if (!stocks[stock]) return `Stock ${stock} not found!`;
            if (!quantity || quantity <= 0) return 'Invalid quantity!';
            if (player.portfolio[stock] < quantity) {
                return `You only have ${player.portfolio[stock]} ${stock} shares!`;
            }

            const proceeds = stocks[stock].price * quantity;
            player.cash += proceeds;
            player.portfolio[stock] -= quantity;
            updatePlayerStats();
            return `✓ Sold ${quantity} ${stock} @ $${stocks[stock].price.toFixed(2)} each for $${proceeds.toFixed(2)}`;
        }

        function submitCommand() {
            const input = document.getElementById('commandInput');
            const command = input.value;

            if (command.trim() === '') return;

            const stockMarket = document.getElementById('stockMarket');
            stockMarket.textContent += '\n$ ' + command + '\n';
            
            const output = processCommand(command);
            stockMarket.textContent += output + '\n';
            stockMarket.scrollTop = stockMarket.scrollHeight;

            input.value = '';
            input.focus();
        }

        document.getElementById('commandInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitCommand();
            }
        });

        function initializeGame() {
            updateMarketDisplay();
            document.getElementById('commandInput').focus();
        }

        // Start intro sequence
        showNextScreen();
    </script>
</body>
</html>
